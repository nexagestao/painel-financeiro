<script>
/* =========================== IDENTIDADE POR EMPRESA =========================== */
const BRAND = {
  AGIBENS:{cor:'#2563EB', nome:'Painel Executivo Financeiro', logo:'AG'},
  DUNORTE:{cor:'#0F766E', nome:'Painel Executivo Financeiro', logo:'DN'}
};
function applyBrand(){
  const b=BRAND[state.empresa];
  state.accent=b.cor; state.appName=b.nome;
  document.documentElement.style.setProperty('--accent',b.cor);
  document.documentElement.style.setProperty('--accent-soft',b.cor+'1A');
}

/* =========================== TOOLTIP =========================== */
const TIPS={}; let tipSeq=0;
function tip(html){ TIPS[++tipSeq]=html; return ' data-tip="'+tipSeq+'"'; }
function tipRows(title, rows){
  return '<div class="tt">'+title+'</div>'+rows.map(r=>'<div class="tr"><i style="background:'+r[0]+'"></i>'+r[1]+'<b>'+r[2]+'</b></div>').join('');
}
function initTip(){
  const d=document.createElement('div'); d.id='ctip'; document.body.appendChild(d);
  document.addEventListener('mousemove',e=>{
    const t=e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    const tp=$('ctip');
    if(t && TIPS[t.dataset.tip]){
      tp.innerHTML=TIPS[t.dataset.tip];
      let x=e.clientX+14, y=e.clientY+12;
      if(x>innerWidth-280) x=e.clientX-274;
      if(y>innerHeight-120) y=e.clientY-100;
      tp.style.left=x+'px'; tp.style.top=y+'px'; tp.style.opacity=1;
    } else tp.style.opacity=0;
  });
}
function pctChange(cur, prev){ if(prev==null||prev===0) return null; return (cur-prev)/Math.abs(prev)*100; }

/* =========================== PRIMITIVAS DE GRÁFICO =========================== */
const NEUT1='#98A2B3', NEUT2='#C7CDD8', NEUTS=['#64748B','#94A3B8','#B4BDC9','#CFD6DE','#E2E6EB'];
function smoothPath(pts){
  if(pts.length<3) return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
function fmtOf(o){ return o&&o.fmt==='pct' ? (x=>pct(x)) : (x=>money(x)); }
function pcLineArea(cid, labels, series, opts){
  opts=opts||{};
  const H=opts.h||300, W=760, L=58, R=18, T=18, B=30;
  const F=fmtOf(opts);
  const all=series.flatMap(s=>s.values.filter(x=>x!=null));
  let {min,max}=yScaleInfo(Math.min(...all,0),Math.max(...all));
  const n=labels.length;
  const X=i=>L+(W-L-R)*i/Math.max(1,n-1), Y=vv=>T+(H-T-B)*(1-(vv-min)/(max-min));
  const gid='g'+cid+Math.floor(Math.random()*1e5);
  let out='<svg class="chart-box" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  out+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
  for(let g=0;g<=4;g++){
    const val=min+(max-min)*g/4, y=Y(val);
    out+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>';
    out+='<text class="axis-lbl" x="'+(L-8)+'" y="'+(y+3)+'" text-anchor="end">'+(opts.fmt==='pct'?Math.round(val)+'%':kfmt(val))+'</text>';
  }
  if(min<0) out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--neg)" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/>';
  labels.forEach((lb,i)=>{ if(n<=13||i%2===0) out+='<text class="axis-lbl" x="'+X(i)+'" y="'+(H-9)+'" text-anchor="middle">'+lb+'</text>'; });
  const TONE={main:['var(--accent)',2.4], ghost:[NEUT1,1.4], ghost2:[NEUT2,1.4], prev:[NEUT1,1.6]};
  series.forEach(s=>{
    const [color,w]=TONE[s.kind]||TONE.main;
    const pts=s.values.map((vv,i)=>vv==null?null:[X(i),Y(vv)]).filter(Boolean);
    if(!pts.length)return;
    const path=smoothPath(pts);
    if(s.kind==='main'&&s.area!==false){
      out+='<path class="pc-fade" d="'+path+' L'+pts[pts.length-1][0]+' '+Y(Math.max(min,0))+' L'+pts[0][0]+' '+Y(Math.max(min,0))+' Z" fill="url(#'+gid+')"/>';
    }
    out+='<path class="pc-line" d="'+path+'" fill="none" stroke="'+color+'" stroke-width="'+w+'"'+(s.kind!=='main'?' stroke-dasharray="5 4"':'')+' stroke-linecap="round"/>';
    if(s.kind==='main'){
      s.values.forEach((vv,i)=>{ if(vv==null)return;
        const last=i===s.values.length-1, negv=vv<0;
        if(negv||last||n<=14) out+='<circle class="pc-fade" cx="'+X(i)+'" cy="'+Y(vv)+'" r="'+(last?4.5:negv?4:2.8)+'" fill="'+(negv?'var(--neg)':'var(--accent)')+'" stroke="var(--surface)" stroke-width="1.5"/>';
      });
    }
  });
  const slot=(W-L-R)/Math.max(1,n-1);
  labels.forEach((lb,i)=>{
    const rows=series.map(s=>{ const [color]=TONE[s.kind]||TONE.main; return s.values[i]==null?null:[color,s.name,F(s.values[i])]; }).filter(Boolean);
    out+='<rect x="'+(X(i)-slot/2)+'" y="0" width="'+slot+'" height="'+H+'" fill="transparent"'+tip(tipRows(lb,rows))+(opts.click?' style="cursor:pointer" onclick="'+opts.click+'('+i+')"':'')+'/>';
  });
  return out+'</svg>';
}
function pcBars(cid, labels, groups, opts){
  opts=opts||{};
  const H=opts.h||280, W=760, L=58, R=18, T=16, B=30;
  const F=fmtOf(opts);
  const all=groups.flatMap(g=>g.values);
  let {min,max}=yScaleInfo(Math.min(0,...all),Math.max(...all,0));
  const n=labels.length, slot=(W-L-R)/n, bw=Math.min(20,(slot-12)/groups.length);
  const Y=vv=>T+(H-T-B)*(1-(vv-min)/(max-min));
  const TONE={accent:'var(--accent)', n1:NEUT1, n2:NEUT2, neg:'var(--neg)', pos:'var(--pos)'};
  let out='<svg class="chart-box" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  for(let g=0;g<=4;g++){
    const val=min+(max-min)*g/4, y=Y(val);
    out+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>';
    out+='<text class="axis-lbl" x="'+(L-8)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(val)+'</text>';
  }
  if(min<0) out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--text2)" stroke-width="1" opacity=".4"/>';
  labels.forEach((lb,i)=>{
    out+='<text class="axis-lbl" x="'+(L+slot*i+slot/2)+'" y="'+(H-9)+'" text-anchor="middle">'+lb+'</text>';
    groups.forEach((g,j)=>{
      const vv=g.values[i], y=Y(Math.max(vv,0)), hh=Math.abs(Y(vv)-Y(0));
      const x=L+slot*i+slot/2-(bw*groups.length+2*(groups.length-1))/2+j*(bw+2);
      const tone=vv<0&&g.negAuto?'var(--neg)':(TONE[g.tone]||TONE.accent);
      out+='<rect class="pc-bar" style="animation-delay:'+(i*35)+'ms" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(hh,1.5)+'" rx="3.5" fill="'+tone+'"/>';
    });
    const rows=groups.map(g=>[(g.values[i]<0&&g.negAuto)?'var(--neg)':(TONE[g.tone]||TONE.accent), g.name, F(g.values[i])]);
    if(opts.extra) rows.push(['var(--text2)', opts.extra.name, F(opts.extra.values[i])]);
    out+='<rect x="'+(L+slot*i)+'" y="0" width="'+slot+'" height="'+H+'" fill="transparent"'+tip(tipRows(lb,rows))+(opts.click?' style="cursor:pointer" onclick="'+opts.click+'('+i+')"':'')+'/>';
  });
  return out+'</svg>';
}
function pcHBars(items, opts){
  opts=opts||{};
  const F=fmtOf(opts);
  const max=Math.max(...items.map(i=>Math.abs(i.value)),1);
  return '<div style="padding:6px 0">'+items.map((it,idx)=>{
    const color=idx===0?'var(--accent)':NEUTS[Math.min(idx,NEUTS.length-1)];
    return '<div style="display:flex;align-items:center;gap:12px;padding:8px 0"'+tip(tipRows(esc(it.name),[[color,'Valor',F(it.value)]]))+'>'+
      '<span style="width:160px;font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(it.name)+'</span>'+
      '<div style="flex:1;height:18px;background:var(--bg);border-radius:999px;overflow:hidden"><div style="width:'+(Math.abs(it.value)/max*100)+'%;height:100%;background:'+color+';border-radius:999px;transition:width .8s cubic-bezier(.2,.7,.3,1)"></div></div>'+
      '<span style="width:104px;text-align:right;font-size:12.5px;font-weight:600" class="money'+(it.value<0?' neg':'')+'">'+F(it.value)+'</span></div>';
  }).join('')+'</div>';
}
const LAST_TM={};
function pcTreemap(cid, items, opts){
  opts=opts||{};
  items=[...items].filter(i=>i.value>0).sort((a,b)=>b.value-a.value);
  LAST_TM[cid]=items;
  const out=[];
  (function layout(arr,x,y,w,h){
    if(!arr.length)return;
    if(arr.length===1){ out.push({...arr[0],x,y,w,h}); return; }
    const tot=arr.reduce((t,i)=>t+i.value,0);
    let a=[], sa=0, i=0;
    while(i<arr.length-1 && sa<tot/2){ a.push(arr[i]); sa+=arr[i].value; i++; }
    const b=arr.slice(i), f=sa/tot;
    if(w>=h){ layout(a,x,y,w*f,h); layout(b,x+w*f,y,w*(1-f),h); }
    else { layout(a,x,y,w,h*f); layout(b,x,y+h*f,w,h*(1-f)); }
  })(items,0,0,100,100);
  const tot=items.reduce((t,i)=>t+i.value,0)||1;
  let h='<div style="position:relative;height:'+(opts.h||300)+'px;margin:4px 2px">';
  out.forEach((c,idx)=>{
    const gi=items.indexOf(c);
    const bg=gi===0?'var(--accent)':NEUTS[Math.min(gi-1,NEUTS.length-1)];
    const light=gi<=1;
    const big=c.w*c.h>500;
    h+='<div class="tm-cell" style="left:'+c.x+'%;top:'+c.y+'%;width:'+c.w+'%;height:'+c.h+'%;background:'+bg+';color:'+(light?'#fff':'var(--text)')+'"'+
       tip(tipRows(esc(c.name),[[bg,'Valor',money(c.value)],['var(--text2)','Participação',pct(c.value/tot*100)]]))+
       (c.code?' onclick="ddTree(\''+cid+'\','+gi+')"':'')+'>'+
       (big?'<div class="tm-n">'+esc(c.name)+'</div><div class="tm-v">'+money(c.value)+' &middot; '+pct(c.value/tot*100,0)+'</div>':'')+'</div>';
  });
  return h+'</div>';
}
function ddTree(cid,idx){
  const it=(LAST_TM[cid]||[])[idx];
  if(it&&it.code) drill(it.code, (LAST_WM[cid.replace(/_full$/,'')]||MSEL()).slice(-1)[0]);
}
function pcDonut(cid, items, opts){
  opts=opts||{};
  const H=opts.h||250, cx=118, cy=H/2, r=Math.min(88,H/2-16), ir=opts.pie?0:r*.64;
  const tot=items.reduce((t,i)=>t+Math.max(0,i.value),0)||1;
  let a0=-Math.PI/2;
  let out='<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:4px 0"><svg width="236" height="'+H+'" viewBox="0 0 236 '+H+'" class="pc-fade" style="opacity:0">';
  items.forEach((it,idx)=>{
    const color=idx===0?'var(--accent)':NEUTS[Math.min(idx-1,NEUTS.length-1)];
    const frac=Math.max(0,it.value)/tot; if(frac<=0.001)return;
    const a1=a0+frac*2*Math.PI, large=frac>.5?1:0;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    let dpath;
    if(opts.pie) dpath='M'+cx+' '+cy+' L'+x0+' '+y0+' A'+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' Z';
    else {
      const xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1), xi0=cx+ir*Math.cos(a0), yi0=cy+ir*Math.sin(a0);
      dpath='M'+x0+' '+y0+' A'+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' L'+xi1+' '+yi1+' A'+ir+' '+ir+' 0 '+large+' 0 '+xi0+' '+yi0+' Z';
    }
    out+='<path d="'+dpath+'" fill="'+color+'" stroke="var(--surface)" stroke-width="2"'+tip(tipRows(esc(it.name),[[color,'Valor',money(it.value)],['var(--text2)','Participação',pct(frac*100)]]))+'/>';
    a0=a1;
  });
  if(!opts.pie) out+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" style="font-size:15px;font-weight:650" fill="var(--text)">'+kfmt(tot)+'</text><text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" class="axis-lbl">total</text>';
  out+='</svg><div style="flex:1;min-width:170px">';
  items.forEach((it,idx)=>{
    const color=idx===0?'var(--accent)':NEUTS[Math.min(idx-1,NEUTS.length-1)];
    out+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px"><i style="width:9px;height:9px;border-radius:3px;background:'+color+';display:inline-block"></i><span style="flex:1;color:var(--text2)">'+esc(it.name)+'</span><span style="font-weight:600" class="money">'+money(it.value)+'</span><span style="color:var(--text2);width:44px;text-align:right">'+pct(Math.max(0,it.value)/tot*100,0)+'</span></div>';
  });
  return out+'</div></div>';
}
function pcWaterfall(cid, steps, opts){
  opts=opts||{};
  const H=opts.h||300, W=760, L=60, R=16, T=16, B=44;
  let run=0;
  const pts=steps.map(s=>{ const st={...s}; if(s.total){ st.from=0; st.to=s.value; run=s.value; } else { st.from=run; st.to=run+s.value; run=st.to; } return st; });
  const all=pts.flatMap(p=>[p.from,p.to,0]);
  let {min,max}=yScaleInfo(Math.min(...all),Math.max(...all));
  const n=steps.length, slot=(W-L-R)/n, bw=Math.min(56,slot-14);
  const Y=vv=>T+(H-T-B)*(1-(vv-min)/(max-min));
  let out='<svg class="chart-box" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  for(let g=0;g<=4;g++){
    const val=min+(max-min)*g/4, y=Y(val);
    out+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>';
    out+='<text class="axis-lbl" x="'+(L-8)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(val)+'</text>';
  }
  out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--text2)" stroke-width="1" opacity=".4"/>';
  pts.forEach((p,i)=>{
    const x=L+slot*i+slot/2-bw/2, y1=Y(Math.max(p.from,p.to)), hh=Math.max(Math.abs(Y(p.from)-Y(p.to)),2);
    const color=p.total?'var(--accent)':(p.value>=0?NEUT1:'var(--neg)');
    out+='<rect class="pc-bar" style="animation-delay:'+(i*45)+'ms" x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+hh+'" rx="3.5" fill="'+color+'"'+
      tip(tipRows(esc(p.name),[[color, p.total?'Acumulado':'Variação', money(p.value)]]))+
      (opts.click?' onclick="'+opts.click+'('+i+')" cursor="pointer"':'')+'/>';
    if(i<n-1) out+='<line x1="'+(x+bw)+'" y1="'+Y(p.to)+'" x2="'+(L+slot*(i+1)+slot/2-bw/2)+'" y2="'+Y(p.to)+'" stroke="var(--text2)" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>';
    const words=String(p.name).split(' ');

  });

function pcAging(){
  const aberto=RECEBER[state.empresa].filter(t=>t.status!=='Recebido');
  const soma=a=>a.reduce((t,x)=>t+x.vprev,0);
  const buckets=agingBuckets();
  const vals=buckets.map(b=>soma(aberto.filter(b[1])));
  const tot=vals.reduce((t,x)=>t+x,0)||1;
  const ops=[1,.78,.6,.46,.34,.24,.15];
  let h='<div style="display:flex;height:26px;border-radius:999px;overflow:hidden;margin:12px 2px 16px">';
  buckets.forEach((b,i)=>{ if(!vals[i])return;
    h+='<div style="width:'+(vals[i]/tot*100)+'%;background:var(--accent);opacity:'+ops[i]+'"'+tip(tipRows(b[0],[['var(--accent)','Valor',money(vals[i])],['var(--text2)','Participação',pct(vals[i]/tot*100)]]))+'></div>';
  });
  h+='</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;padding:0 2px">';
  buckets.forEach((b,i)=>{
    h+='<div><div style="font-size:11px;color:var(--text2)"><i style="display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--accent);opacity:'+ops[i]+';margin-right:5px"></i>'+b[0]+'</div><div style="font-size:13px;font-weight:600;margin-top:3px">'+money(vals[i])+'</div></div>';
  });
  return h+'</div>';
}

/* =========================== FILTRO DE PERÍODO =========================== */
const per={start:null,end:null,calM:0,calY:2026,shortcut:'Ano atual'};
function ensurePPanel(){
  if($('ppanel'))return;
  const d=document.createElement('div'); d.id='ppanel'; document.body.appendChild(d);
}
function openPeriodo(){ ensurePPanel(); renderPP(); $('ppanel').classList.add('on'); $('overlay').classList.add('on'); }
function closePeriodo(){ const p=$('ppanel'); if(p)p.classList.remove('on'); }
const PP_SHORT=[['Ano atual'],['Ano atual (até hoje)'],['Último ano'],['Mês atual'],['Último mês'],['Últimos 3 meses'],['Últimos 6 meses'],['Últimos 12 meses'],['Período personalizado']];
function ppShortcut(nome){
  per.shortcut=nome;
  const clamp=msg=>toast('A base demonstrativa contém apenas 2026 — período ajustado. '+(msg||''));
  let ms=null, lbl=nome;
  if(nome==='Ano atual'){ ms=[5,11]; lbl='01/06/2026 &rarr; 31/12/2026'; }
  else if(nome==='Ano atual (até hoje)'){ ms=[5,6]; lbl='01/06/2026 &rarr; 31/07/2026'; }
  else if(nome==='Último ano'){ ms=[5,11]; lbl='Jun — Dez/2026'; clamp('(2025 e Jan–Mai/2026 sem dados)'); }
  else if(nome==='Mês atual'){ ms=[6,6]; lbl='Julho/2026'; }
  else if(nome==='Último mês'){ ms=[5,5]; lbl='Junho/2026'; }
  else if(nome==='Últimos 3 meses'){ ms=[4,6]; lbl='Mai — Jul/2026'; }
  else if(nome==='Últimos 6 meses'){ ms=[1,6]; lbl='Fev — Jul/2026'; }
  else if(nome==='Últimos 12 meses'){ ms=[5,6]; lbl='Jun — Jul/2026'; clamp('(meses anteriores a junho/2026 sem dados)'); }
  else { renderPP(); return; }
  state.mesesSel=[]; for(let m=ms[0];m<=ms[1];m++)state.mesesSel.push(m);
  per.start=new Date(2026,ms[0],1); per.end=new Date(2026,ms[1]+1,0);
  aplicarLabel(lbl.replace(/&rarr;/g,'→'));
  renderPP(); render();
}
function aplicarLabel(lbl){
  state.periodoLabel=lbl;
  state.filtros=state.filtros.filter(f=>f.k!=='Período');
  state.filtros.push({k:'Período',v:lbl});
}
function ppToggleMes(m){
  const i=state.mesesSel.indexOf(m);
  if(i>=0){ if(state.mesesSel.length>1) state.mesesSel.splice(i,1); }
  else state.mesesSel.push(m);
  per.start=null; per.end=null; per.shortcut=null;
  const sel=MSEL();
  const cont = sel.length===sel[sel.length-1]-sel[0]+1;
  aplicarLabel(sel.length===12?'Ano 2026':(cont&&sel.length>1? MESES[sel[0]]+' — '+MESES[sel[sel.length-1]]+'/2026' : 'Meses: '+sel.map(x=>MESES[x]).join(', ')));
  renderPP(); render();
}
function ppTodosMeses(on){
  state.mesesSel = on?[5,6,7,8,9,10,11]:[6];
  aplicarLabel(on?'Jun — Dez/2026':'Julho/2026');
  renderPP(); render();
}
function ppDay(y,m,d){
  const dt=new Date(y,m,d);
  if(!per.start || per.end){ per.start=dt; per.end=null; }
  else { if(dt<per.start){ per.end=per.start; per.start=dt; } else per.end=dt; }
  per.shortcut='Período personalizado';
  renderPP();
}
function ppNav(dm){
  per.calM+=dm;
  while(per.calM<0){per.calM+=12;per.calY--;}
  while(per.calM>11){per.calM-=12;per.calY++;}
  renderPP();
}
function ppAplicar(){
  if(per.start){
    const e=per.end||per.start;
    let m0=per.start.getFullYear()<2026?0:(per.start.getFullYear()>2026?11:per.start.getMonth());
    let m1=e.getFullYear()>2026?11:(e.getFullYear()<2026?0:e.getMonth());
    if(per.start.getFullYear()!==2026||e.getFullYear()!==2026) toast('A base demonstrativa contém apenas 2026 — o intervalo foi ajustado.');
    state.mesesSel=[]; for(let m=m0;m<=m1;m++)state.mesesSel.push(m);
    aplicarLabel(per.start.toLocaleDateString('pt-BR')+' → '+e.toLocaleDateString('pt-BR'));
  }
  closePeriodo();
  if(!$('drawer').classList.contains('on')&&!$('modal').classList.contains('on'))$('overlay').classList.remove('on');
  render();
}
function ppLimpar(){
  per.start=null; per.end=null; per.shortcut='Ano atual';
  state.mesesSel=[5,6,7,8,9,10,11];
  aplicarLabel('Jun — Dez/2026');
  renderPP(); render();
}
function calMonthHtml(y,m){
  const NOME=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let h='<div><div style="text-align:center;font-size:13px;font-weight:650;color:var(--accent);margin-bottom:8px">'+NOME[m]+' '+y+'</div><div class="cal-grid">';
  ['D','S','T','Q','Q','S','S'].forEach(dd=>h+='<div class="dow">'+dd+'</div>');
  const first=new Date(y,m,1).getDay(), nd=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)h+='<div class="cal-d out"></div>';
  for(let d2=1;d2<=nd;d2++){
    const dt=new Date(y,m,d2);
    const s=per.start,e=per.end||per.start;
    let cls='cal-d';
    if(s&&dt>=s&&dt<=e) cls+= (dt.getTime()===s.getTime()||dt.getTime()===e.getTime())?' edge':' inr';
    h+='<div class="'+cls+'" onclick="ppDay('+y+','+m+','+d2+')">'+d2+'</div>';
  }
  return h+'</div></div>';
}
function renderPP(){
  ensurePPanel();
  const m2=(per.calM+1)%12, y2=per.calM===11?per.calY+1:per.calY;
  let h='<div class="pp-side"><div class="nav-sec" style="padding:6px 12px">Atalhos</div>';
  PP_SHORT.forEach(s=>{ h+='<button class="'+(per.shortcut===s[0]?'on':'')+'" onclick="ppShortcut(\''+s[0]+'\')">'+s[0]+'</button>'; });
  h+='</div><div class="pp-main">';
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">'+
     '<div style="display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500">'+icon('calendar',14)+
     '<span>'+(per.start?per.start.toLocaleDateString('pt-BR'):'Data inicial')+'</span><span style="color:var(--text2)">&rarr;</span>'+
     '<span>'+(per.end?per.end.toLocaleDateString('pt-BR'):(per.start?per.start.toLocaleDateString('pt-BR'):'Data final'))+'</span></div>'+
     '<div style="flex:1"></div>'+
     '<button class="icon-btn" onclick="ppNav(-12)" title="Ano anterior">&laquo;</button><button class="icon-btn" onclick="ppNav(-1)" title="Mês anterior">&lsaquo;</button>'+
     '<button class="icon-btn" onclick="ppNav(1)" title="Próximo mês">&rsaquo;</button><button class="icon-btn" onclick="ppNav(12)" title="Próximo ano">&raquo;</button>'+
     '<button class="icon-btn" onclick="ppAplicar()" title="Fechar">'+icon('x',15)+'</button></div>';
  h+='<div class="cal-two" style="display:grid;grid-template-columns:1fr 1fr;gap:22px">'+calMonthHtml(per.calY,per.calM)+calMonthHtml(y2,m2)+'</div>';
  h+='<div style="margin:16px 0 8px;font-size:12px;font-weight:600;color:var(--text2)">Meses de 2026 <span style="font-weight:400">— clique para selecionar um ou vários</span></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:7px">';
  MESES.forEach((mm,i)=>{ h+='<button class="mes-chip'+(state.mesesSel.includes(i)?' on':'')+'" onclick="ppToggleMes('+i+')">'+mm+'</button>'; });
  h+='</div>';
  h+='<div style="display:flex;gap:8px;margin-top:16px;align-items:center">'+
     '<button class="btn sm" onclick="ppTodosMeses(true)">Todos os meses</button>'+
     '<button class="btn sm ghost" onclick="ppLimpar()">Limpar seleção</button>'+
     '<div style="flex:1"></div>'+
     '<button class="btn primary" onclick="ppAplicar()">Aplicar filtro</button></div>';
  h+='</div>';
  $('ppanel').innerHTML=h;
}

const LAST_WM={};
function winMonths(id){
  const ui=chartUI(id), base=MSEL();
  let wm=base;
  if(ui.win){ const mx=base[base.length-1]; const st=Math.max(0,mx-ui.win+1); wm=[]; for(let m=st;m<=mx;m++)wm.push(m); }
  LAST_WM[id]=wm;
  return wm;
}
function trendFor(fn, wm){
  const cur=wm.reduce((t,m)=>t+fn(m),0);
  const st=wm[0]-wm.length;
  if(st<0)return null;
  let prev=0; for(let m=st;m<wm[0];m++)prev+=fn(m);
  return pctChange(cur,prev);
}
function dreLine(nome){
  const cfg=DRE_CFG[state.empresa];

function defaultDash(perfil){
  const card=(id,extra)=>Object.assign({id, on:true, nome:null, size:'normal', fmt:'auto', comp:true, pctOn:true, icone:false, cor:'auto'},extra||{});
  const chart=(id,size,extra)=>Object.assign({id, on:true, titulo:null, tipo:null, size:size||CHART_DEFS[id].size, legenda:true, valores:true, comp:true, drill:true},extra||{});
  const filtros=['regime','periodo','empresa','banco','categoria','conta','centro','status','resp','base'].map(id=>({id, on:['regime','periodo','empresa','banco','categoria','status'].includes(id), obrig:id==='periodo'}));
  let cards, charts;
  if(perfil==='Diretoria'){ cards=['saldo_atual','saldo_proj','ebitda','resultado'].map(c=>card(c)); charts=[chart('evolucao',6),chart('rcd',3),chart('resultado_mensal',3)]; }
  else if(perfil==='Cliente'){ cards=['saldo_atual','resultado','ebitda','inadimplencia'].map(c=>card(c)); charts=[chart('evolucao',6),chart('comp_despesas',3),chart('rec_categoria',3)]; }
  else if(perfil==='Visualização'){ cards=['saldo_atual','saldo_proj'].map(c=>card(c)); charts=[chart('evolucao',6)]; }
  else if(perfil==='Financeiro'){ cards=['total_pagar','total_receber','vencidas','prox_venc','saldo_atual','geracao'].map(c=>card(c)); charts=[chart('pxr',3),chart('fluxo_es',3),chart('saldo_bancos',3),chart('aging',3),chart('vencimentos',3),chart('alertas',3)]; }
  else { cards=['saldo_atual','saldo_proj','entradas','saidas','geracao','resultado'].map(c=>card(c));
    charts=[chart('evolucao',6),chart('fluxo_es',3),chart('rcd',3),chart('pxr',3),chart('saldo_bancos',3),chart('resultado_mensal',6),chart('comp_despesas',3),chart('comp_custos',3),chart('rec_categoria',3),chart('desp_categoria',3),chart('inadimplencia',3),chart('aging',3),chart('vencimentos',3),chart('alertas',3)]; }
  return {cols:cards.length>=6?6:cards.length, cards, charts, filtros, versoes:[], atualizado:null, por:null};
}
let DASH_STORE={};
function dashKey(emp,perfil){ return (emp||state.empresa)+'|'+(perfil||state.role); }
function dashCfg(emp,perfil){
  const k=dashKey(emp,perfil);
  if(!DASH_STORE[k]) DASH_STORE[k]=defaultDash(perfil||state.role);
  return DASH_STORE[k];
}
function saveDash(){
  try{
    const k=dashKey(state.empresa, state.dcfgPerfil||state.role);
    const cfg=DASH_STORE[k];
    if(cfg){ cfg.atualizado=new Date().toLocaleString('pt-BR'); cfg.por='Gabriela Lima'; }
    localStorage.setItem('pef_v2', JSON.stringify({dash:DASH_STORE, brand:BRAND}));
  }catch(e){}
}
function loadDash(){
  try{
    const raw=localStorage.getItem('pef_v2');
    if(raw){ const o=JSON.parse(raw);
      if(o.dash) DASH_STORE=o.dash;
      if(o.brand) Object.keys(o.brand).forEach(k=>{ if(BRAND[k]) Object.assign(BRAND[k], o.brand[k]); });
    }
  }catch(e){}
}

/* ---------- ctx de cálculo ---------- */
function dashCtx(){
  const reg=state.regime==='pxr'?'proj':state.regime;
  const wm=MSEL();
  const s=fn=>wm.reduce((t,m)=>t+fn(m),0);
  const st=wm[0]-wm.length;
  const sp=fn=> st<0?null:Array.from({length:wm.length},(_,i)=>st+i).reduce((t,m)=>t+fn(m),0);
  const ent=s(m=>fluxoMes(m,reg).ent), sai=s(m=>fluxoMes(m,reg).sai);
  const lRB=dreLine('RECEITA BRUTA'), lEB=dreLine('EBITDA'), lRES=dreLine('RESULTADO LÍQUIDO');
  const rb=s(m=>dreLinhaVal(lRB,m,reg)), eb=s(m=>dreLinhaVal(lEB,m,reg)), res=s(m=>dreLinhaVal(lRES,m,reg));
  const abertoP=pagarSel().filter(t=>t.status!=='Pago');
  const abertoR=receberSel().filter(t=>t.status!=='Recebido');
  const somaT=a=>a.reduce((t,x)=>t+x.vprev,0);
  const vencP=somaT(pagarSel().filter(t=>t.status==='Vencido'));
  const vencRl=receberSel().filter(t=>t.status==='Vencido');
  return {
    reg, wm, ent, sai,
    entD:pctChange(ent,sp(m=>fluxoMes(m,reg).ent)), saiD:pctChange(sai,sp(m=>fluxoMes(m,reg).sai)),
    rb, rbD:pctChange(rb,sp(m=>dreLinhaVal(lRB,m,reg))),
    custos:s(m=>v('2',m,reg)), despesas:s(m=>v('3',m,reg)),
    eb, ebD:pctChange(eb,sp(m=>dreLinhaVal(lEB,m,reg))),
    res, resD:pctChange(res,sp(m=>dreLinhaVal(lRES,m,reg))),
    saldoA:saldoAtual(), saldoP:saldos('proj')[11].fim, menor:menorSaldoProj(),
    inad:somaT(vencRl)/(somaT(RECEBER[state.empresa])||1)*100,
    totPagar:somaT(abertoP), nPagar:abertoP.length,
    totReceber:somaT(abertoR), nReceber:abertoR.length,
    vencidas:vencP+somaT(vencRl),
    prox7:somaT(abertoP.filter(t=>t.venc>HOJE&&(t.venc-HOJE)/86400000<=7))
  };
}
function fmtCard(val, fmt){
  if(fmt==='p') return pct(val);
  if(fmt==='q') return Math.round(val).toLocaleString('pt-BR');
  return money(val);
}

/* ---------- render do dashboard (visão e editor) ---------- */
let dragInfo=null;
function dgStart(ev,kind,i){ dragInfo={kind,i}; ev.dataTransfer.effectAllowed='move'; }
function dgOver(ev){ ev.preventDefault(); }
function dgDrop(ev,kind,i){
  ev.preventDefault();
  if(!dragInfo||dragInfo.kind!==kind)return;
  const cfg=dashCfg(state.empresa, state.dcfgPerfil||state.role);
  const arr=kind==='card'?cfg.cards:cfg.charts;
  const [it]=arr.splice(dragInfo.i,1);
  arr.splice(i,0,it);
  dragInfo=null; saveDash(); render();
}
function dselect(kind,id){ state.dsel={kind,id}; if(state.view==='admin')render(); }
function dashHide(kind,id){
  const cfg=dashCfg(state.empresa, state.dcfgPerfil||state.role);
  const arr=kind==='card'?cfg.cards:cfg.charts;
  const it=arr.find(x=>x.id===id); if(it)it.on=false;
  saveDash(); render();
}
function renderDashboardInto(cfg, editor){
  const ctx=dashCtx();
  const perfilView = editor ? (state.dcfgPerfil||state.role) : state.role;
  let h='';
  const cardsOn=cfg.cards.filter(c=>c.on);
  h+='<div class="kpi-grid" style="grid-template-columns:repeat('+(cfg.cols||4)+',1fr)">';
  cardsOn.forEach((c,i)=>{
    const def=CARD_DEFS[c.id]; if(!def)return;
    const r=def.calc(ctx);
    const fmt=c.fmt==='auto'?def.fmt:c.fmt;
    const big=c.size==='principal', dupla=c.size==='dupla'||big, comp=c.size==='compacto';
    let inner='<div class="lb">'+(c.icone?icon('wallet',13)+' ':'')+esc(c.nome||def.t)+'</div>'+
      '<div class="vl '+(c.cor==='auto'?(r.cor||''):c.cor)+'" style="'+(big?'font-size:30px':'')+(comp?'font-size:19px':'')+'">'+fmtCard(r.v,fmt)+'</div><div class="dl">';
    if(c.comp&&c.pctOn&&r.delta!=null){
      const up=r.delta>=0;
      inner+='<span class="delta '+(up?'up':'down')+'">'+(up?'&#9650;':'&#9660;')+' '+pct(Math.abs(r.delta))+'</span>';
    }
    inner+='</div>';
    const sel=editor&&state.dsel&&state.dsel.kind==='card'&&state.dsel.id===c.id;
    h+='<div class="kpi dz'+(sel?' selected':'')+'" style="'+(dupla?'grid-column:span 2;':'')+(comp?'padding:10px 14px;':'')+'"'+
       (editor?' draggable="true" ondragstart="dgStart(event,\'card\','+i+')" ondragover="dgOver(event)" ondrop="dgDrop(event,\'card\','+i+')" onclick="dselect(\'card\',\''+c.id+'\')"':'')+'>'+
       (editor?'<div class="dz-tools"><button title="Ocultar" onclick="event.stopPropagation();dashHide(\'card\',\''+c.id+'\')">&times;</button></div>':'')+
       inner+'</div>';
  });
  h+='</div>';
  const chartsOn=cfg.charts.filter(c=>c.on);
  h+='<div class="dash-grid">';
  chartsOn.forEach((c,i)=>{
    const def=CHART_DEFS[c.id]; if(!def)return;
    const ui=chartUI(c.id); if(c.tipo)ui.tipo=c.tipo;
    let r; try{ r=def.render(ui); }catch(e){ r={body:'<div class="empty"><div class="t2">Erro ao renderizar</div></div>',trend:null}; }
    const sel=editor&&state.dsel&&state.dsel.kind==='chart'&&state.dsel.id===c.id;
    h+='<div class="dz'+(sel?' selected':'')+'" style="grid-column:span '+(c.size||def.size)+';min-width:0"'+
       (editor?' draggable="true" ondragstart="dgStart(event,\'chart\','+i+')" ondragover="dgOver(event)" ondrop="dgDrop(event,\'chart\','+i+')" onclick="dselect(\'chart\',\''+c.id+'\')"':'')+'>'+
       (editor?'<div class="dz-tools"><button title="Ocultar" onclick="event.stopPropagation();dashHide(\'chart\',\''+c.id+'\')">&times;</button></div>':'')+
       chartCard({id:c.id, title:esc(c.titulo||def.t), desc:def.d, trend:c.comp?r.trend:null, body:r.body, quick:!editor})+'</div>';
  });
  h+='</div>';
  return h;
}

function dashProp(kind,id,prop,val){
  const cfg=dashCfg(state.empresa, state.dcfgPerfil);
  const arr=kind==='card'?cfg.cards:cfg.charts;
  const item=arr.find(x=>x.id===id); if(!item)return;
  if(prop==='size'&&kind==='chart') item.size=parseInt(val,10);
  else if(prop==='comp'||prop==='icone') item[prop]=!!val;
  else item[prop]=val;
  saveDash(); render();
}
function dashAdd(kind,id){
  const cfg=dashCfg(state.empresa, state.dcfgPerfil);
  const arr=kind==='card'?cfg.cards:cfg.charts;
  const ex=arr.find(x=>x.id===id);
  if(ex) ex.on=true;
  else if(kind==='card') arr.push({id,on:true,nome:null,size:'normal',fmt:'auto',comp:true,pctOn:true,icone:false,cor:'auto'});
  else arr.push({id,on:true,titulo:null,tipo:null,size:CHART_DEFS[id].size,legenda:true,valores:true,comp:true,drill:true});
  saveDash(); render();
}
function dashCols(n){ dashCfg(state.empresa,state.dcfgPerfil).cols=n; saveDash(); render(); }
function dashFiltro(i){ const cfg=dashCfg(state.empresa,state.dcfgPerfil); const f=cfg.filtros[i]; if(f.obrig){toast('O filtro de período é obrigatório');return;} f.on=!f.on; saveDash(); render(); }
function dashSaveVersion(){
  const cfg=dashCfg(state.empresa,state.dcfgPerfil);
  cfg.versoes.push({data:new Date().toLocaleString('pt-BR'), por:'Gabriela Lima', snap:JSON.stringify({cols:cfg.cols,cards:cfg.cards,charts:cfg.charts,filtros:cfg.filtros})});
  if(cfg.versoes.length>8)cfg.versoes.shift();
  saveDash(); toast('Versão salva ('+cfg.versoes.length+' no histórico)'); render();
}
function dashRestoreVersion(){
  const cfg=dashCfg(state.empresa,state.dcfgPerfil);
  const v=cfg.versoes.pop();
  if(!v){ toast('Nenhuma versão anterior salva'); return; }
  Object.assign(cfg, JSON.parse(v.snap));
  saveDash(); toast('Versão de '+v.data+' restaurada'); render();
}
function dashReset(){
  DASH_STORE[dashKey(state.empresa,state.dcfgPerfil)]=defaultDash(state.dcfgPerfil);
  state.dsel=null; saveDash(); toast('Layout padrão restaurado'); render();
}
function dashCopyFrom(){
  let h=drawerHead('Copiar layout de...','Duplicar a configuração de outra empresa ou perfil para '+EMPRESAS[state.empresa].curto+' / '+state.dcfgPerfil);
  h+='<div class="drawer-body">';
  h+='<div class="field"><label>Empresa de origem</label><select id="cpEmp">'+Object.keys(EMPRESAS).map(k=>'<option value="'+k+'">'+EMPRESAS[k].curto+'</option>').join('')+'</select></div>';
  h+='<div class="field"><label>Perfil de origem</label><select id="cpPerf">'+Object.keys(PERFIS).map(p=>'<option>'+p+'</option>').join('')+'</select></div>';
  h+='</div><div class="drawer-foot"><button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="dashDoCopy()">Copiar layout</button></div>';
  openDrawer(h);
}
function dashDoCopy(){
  const src=dashCfg($('cpEmp').value, $('cpPerf').value);
  DASH_STORE[dashKey(state.empresa,state.dcfgPerfil)]=JSON.parse(JSON.stringify(src));
  closeDrawer(); saveDash(); toast('Layout copiado de '+EMPRESAS[$('cpEmp').value].curto+' / '+$('cpPerf').value); render();
}

/* ---------- gráfico em tela cheia ---------- */
function openChartFull(id){
  state.fullId=id;
  renderChartFull();
}
function renderChartFull(){
  const id=state.fullId, def=CHART_DEFS[id];
  if(!def)return;
  const ui=chartUI(id);
  const TN={area:'Área',linha:'Linha',colunas:'Colunas',barras:'Barras',empilhadas:'Empilhadas',pizza:'Pizza',rosca:'Rosca',waterfall:'Waterfall',tabela:'Tabela',ranking:'Ranking',treemap:'Treemap'};
  let r; try{ r=def.render(ui,{h:440,big:true}); }catch(e){ r={body:'<div class="empty"><div class="t2">Erro ao renderizar.</div></div>'}; }
  let h='<div class="modal-head" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><div class="drawer-title">'+def.t+'</div><div class="drawer-sub">'+EMPRESAS[state.empresa].nome+'</div></div>'+
    '<select class="select" onchange="setEmpresa(this.value);renderChartFull()">'+Object.keys(EMPRESAS).map(k=>'<option value="'+k+'"'+(k===state.empresa?' selected':'')+'>'+EMPRESAS[k].curto+'</option>').join('')+'</select>'+
    '<button class="btn sm" onclick="openPeriodo()">'+icon('calendar',13)+' '+esc(state.periodoLabel)+'</button>'+
    '<select class="select" onchange="chartUI(\''+id+'\').tipo=this.value;renderChartFull()">'+def.tipos.map(t=>'<option value="'+t+'"'+((ui.tipo||def.tipos[0])===t?' selected':'')+'>'+(TN[t]||t)+'</option>').join('')+'</select>'+
    '<div class="seg">'+[[null,'Período'],[6,'6M'],[12,'Ano']].map(q=>'<button class="'+(ui.win===q[0]?'on':'')+'" onclick="chartUI(\''+id+'\').win='+(q[0]===null?'null':q[0])+';renderChartFull()">'+q[1]+'</button>').join('')+'</div>'+
    '<button class="btn sm" onclick="toast(\'Exportação demonstrativa — '+def.t+'\')">'+icon('download',13)+' Exportar</button>'+
    '<button class="icon-btn" onclick="closeModal();render()">'+icon('x',16)+'</button></div>';
  h+='<div class="modal-body">'+r.body+'</div>';
  openModal(h);
  $('modalCard').classList.add('wide');
}

function parseYMD(s){
  if(!s) return null;
  const [y,m,day] = s.split('-').map(Number);
  return new Date(y, m-1, day);
}
function compStr(dt){ return dt ? String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear() : ''; }

async function hydrateAgibensReal(){
  const [pagarRes, receberRes, contasRes, saldosRes] = await Promise.all([
    sb.from('titulos_pagar').select('*').eq('empresa_id', AGIBENS_ID),
    sb.from('titulos_receber').select('*').eq('empresa_id', AGIBENS_ID),
    sb.from('contas_bancarias').select('*').eq('empresa_id', AGIBENS_ID).eq('ativa', true),
    sb.from('saldos_bancarios').select('*').eq('empresa_id', AGIBENS_ID).order('data',{ascending:false})
  ]);
  if(pagarRes.error || receberRes.error) throw (pagarRes.error||receberRes.error);

  const pagarRows = pagarRes.data || [];
  const receberRows = (receberRes.data || []).filter(r=>r.status!=='Cancelado');
  const contas = contasRes.data || [];
  const saldosRows = saldosRes.data || [];

  PAGAR.AGIBENS = pagarRows.map(r=>{
    const venc = parseYMD(r.vencimento), pgto = parseYMD(r.pagamento);
    let status = r.status;
    if(status==='Em aberto' && venc && venc < HOJE) status='Vencido';
    return {id:'CP-'+r.id.slice(0,8), forn:r.fornecedor, doc:'', desc:r.fornecedor,
      conta:r.conta_codigo, centro:r.centro||'', banco:r.banco||'',
      comp:compStr(venc), emissao:venc, venc, pgto,
      vprev:Number(r.valor_previsto), vpago:Number(r.valor_pago||0), status};
  });

  RECEBER.AGIBENS = receberRows.map(r=>{
    const venc = parseYMD(r.vencimento), rec = parseYMD(r.recebimento);
    let status = r.status;
    if(status==='Em aberto' && venc && venc < HOJE) status='Vencido';
    return {id:'CR-'+(r.codigo||r.id.slice(0,8)), cli:r.cliente, doc:r.codigo||'',
      desc:r.cliente, conta:r.conta_codigo, centro:'Receitas', banco:'',
      comp:compStr(venc), emissao:venc, venc, rec,
      vprev:Number(r.valor_previsto), vrec:Number(r.valor_recebido||0), status};
  });

  // O acompanhamento da Agibens começa em junho/2026 (mês 5) — o saldo inicial
  // já reflete tudo o que veio antes. Lançamentos com data anterior a junho
  // (ex.: recebíveis de maio ainda na base) não entram na simulação de novo,
  // senão o efeito deles seria contado duas vezes.
  const INICIO_ANO = 5;
  const newVal = {};
  analiticas().forEach(a=>{ newVal[a.c] = {prev:Array(12).fill(0), real:Array(12).fill(0)}; });
  PAGAR.AGIBENS.forEach(t=>{
    if(t.venc && t.venc.getFullYear()===ANO && t.venc.getMonth()>=INICIO_ANO && newVal[t.conta]) newVal[t.conta].prev[t.venc.getMonth()] += t.vprev;
    if(t.pgto && t.pgto.getFullYear()===ANO && t.pgto.getMonth()>=INICIO_ANO && newVal[t.conta]) newVal[t.conta].real[t.pgto.getMonth()] += t.vpago;
  });
  RECEBER.AGIBENS.forEach(t=>{
    if(t.venc && t.venc.getFullYear()===ANO && t.venc.getMonth()>=INICIO_ANO && newVal[t.conta]) newVal[t.conta].prev[t.venc.getMonth()] += t.vprev;
    if(t.rec && t.rec.getFullYear()===ANO && t.rec.getMonth()>=INICIO_ANO && newVal[t.conta]) newVal[t.conta].real[t.rec.getMonth()] += t.vrec;
  });
  VAL.AGIBENS = newVal;

  const saldoPorConta = {};
  saldosRows.forEach(s=>{ if(!(s.conta_bancaria_id in saldoPorConta)) saldoPorConta[s.conta_bancaria_id]=Number(s.saldo); });
  if(contas.length){
    const totalFinal = contas.reduce((t,c)=>t+(saldoPorConta[c.id] ?? Number(c.saldo_inicial)),0);
    BASES.AGIBENS.bancos = contas.map(c=>({nome:c.nome, banco:c.banco,
      prop: totalFinal>0 ? (saldoPorConta[c.id] ?? Number(c.saldo_inicial))/totalFinal : 1/contas.length}));
    // saldoIni é o saldo de 1º de junho (real, das contas bancárias) — como
    // jan–mai não entram na simulação, ele já "chega" em junho sem alteração.
    BASES.AGIBENS.saldoIni = contas.reduce((t,c)=>t+Number(c.saldo_inicial),0);
  }
}

async function showApp(){
  $('loginGate').style.display='none';

  render();
}
