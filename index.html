<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Executivo Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --text:#101828; --text2:#667085; --border:#E4E7EC;
  --accent:#2563EB; --accent-soft:#EFF4FF; --pos:#16A34A; --pos-soft:#F0FDF4;
  --neg:#DC2626; --neg-soft:#FEF2F2; --warn:#D97706; --warn-soft:#FFFBEB;
  --r:12px; --r-sm:10px; --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 8px 24px rgba(16,24,40,.10);
  --side-w:240px; --pad:24px; --row-h:38px;
}
body.dark{
  --bg:#0D1117; --surface:#161B22; --text:#E6EAF2; --text2:#8B95A7; --border:#262D38;
  --accent-soft:#16233F; --pos-soft:#0E2318; --neg-soft:#2A1414; --warn-soft:#271D0A;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 8px 24px rgba(0,0,0,.45);
}
body.compact{ --pad:16px; --row-h:31px; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Login ---------- */
#loginGate{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)}
.login-card{width:340px;max-width:90vw;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:28px 26px}
.login-card .brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.login-card h1{font-size:16px;font-weight:700;margin-bottom:4px}
.login-card p{font-size:12.5px;color:var(--text2);margin-bottom:18px}
.login-field{margin-bottom:12px}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.login-field input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:13.5px}
.login-field input:focus{outline:none;border-color:var(--accent)}
.login-card .btn.primary{width:100%;justify-content:center;padding:10px;margin-top:6px}
.login-error{color:var(--neg);font-size:12.5px;margin-top:10px;min-height:16px}

/* ---------- Shell ---------- */
#app{display:none;height:100vh;overflow:hidden}
#app.ready{display:flex}
#sidebar{width:var(--side-w);min-width:var(--side-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:min-width .22s,width .22s;overflow:hidden}
#app.collapsed #sidebar{width:64px;min-width:64px}
.side-head{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.brand-name{font-weight:600;font-size:14px;white-space:nowrap;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--text2);white-space:nowrap}
#app.collapsed .brand-name,#app.collapsed .brand-sub{display:none}
.company-pill{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);cursor:pointer;width:100%}
.company-pill:hover{border-color:var(--accent)}
.company-dot{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.company-pill span.nm{font-weight:600;font-size:12.5px;flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app.collapsed .company-pill span,#app.collapsed .company-pill svg{display:none}
#app.collapsed .company-pill{justify-content:center;padding:8px 6px}
.side-nav{flex:1;overflow-y:auto;padding:10px 10px 16px}
.nav-sec{font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--text2);text-transform:uppercase;padding:14px 8px 6px;white-space:nowrap}
#app.collapsed .nav-sec{visibility:hidden;height:10px;padding:6px 0}
.side-link{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--text2);font-size:13.5px;font-weight:500;width:100%;margin-bottom:2px;white-space:nowrap;transition:background .12s,color .12s}
.side-link:hover{background:var(--bg);color:var(--text)}
.side-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-link svg{flex:none}
#app.collapsed .side-link{justify-content:center;padding:9px 0}
#app.collapsed .side-link span{display:none}
.side-foot{border-top:1px solid var(--border);padding:12px 14px}
.user-row{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.user-meta{flex:1;min-width:0}
.user-meta .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-meta .rl{font-size:11px;color:var(--text2)}
#app.collapsed .user-meta,#app.collapsed .role-sel{display:none}
.role-sel{margin-top:10px;width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:12px;color:var(--text2)}

/* ---------- Main / Topbar ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:58px;min-height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 var(--pad)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text2);border:1px solid transparent}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.top-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--bg)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--pos)}
.top-sep{flex:1}
.select{padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .12s}
.btn:hover{border-color:var(--text2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--bg);color:var(--text)}
.badge-n{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--neg)}

/* ---------- Content ---------- */
#content{flex:1;overflow-y:auto;padding:var(--pad)}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:650;letter-spacing:-.02em}
.page-sub{font-size:12.5px;color:var(--text2);margin-top:3px}
.page-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border:1px solid rgba(217,119,6,.25);padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);padding:4px 6px 4px 10px;border-radius:999px}
.chip button{color:inherit;opacity:.7;font-size:13px;line-height:1;padding:2px 4px}
.chip button:hover{opacity:1}

/* ---------- Cards / KPI ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px;padding:15px 18px 0}
.card-title{font-size:13.5px;font-weight:600}
.card-sub{font-size:11.5px;color:var(--text2);margin-top:2px}
.card-body{padding:16px 18px 18px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow)}
.kpi .lb{font-size:12px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:6px}
.kpi .vl{font-size:23px;font-weight:650;letter-spacing:-.02em;margin:7px 0 5px;font-variant-numeric:tabular-nums}
.kpi .vl.pos{color:var(--pos)} .kpi .vl.neg{color:var(--neg)}
.kpi .dl{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:11.5px;padding:1px 7px;border-radius:999px}
.delta.up{color:var(--pos);background:var(--pos-soft)}
.delta.down{color:var(--neg);background:var(--neg-soft)}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-65-35{grid-template-columns:1.85fr 1fr}
.g-50{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.g-65-35,.g-50{grid-template-columns:1fr}}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:2}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;height:var(--row-h)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.hoverable:hover td{background:var(--bg);cursor:pointer}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num{text-align:right}
.money{font-variant-numeric:tabular-nums}
.money.neg{color:var(--neg)}
.money.pos{color:var(--pos)}
.tbl-wrap{overflow:auto;border-radius:0 0 var(--r) var(--r)}

/* hierarchical tree table */
.tree-toggle{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;margin-right:8px;background:var(--surface);flex:none;line-height:1}
.tree-toggle:hover{color:var(--accent);border-color:var(--accent)}
.tree-lbl{display:flex;align-items:center}
tr.lvl0>td:first-child{font-weight:650}
tr.lvl1>td:first-child{padding-left:30px;font-weight:600}
tr.lvl2>td:first-child{padding-left:52px}
tr.lvl3>td:first-child{padding-left:74px}
tr.row-total td{font-weight:650;background:var(--bg)}
tr.row-result td{font-weight:650;background:var(--accent-soft)}
tr.row-sub td{font-weight:600;background:var(--bg)}
td.clickv{cursor:pointer;border-radius:6px}
td.clickv:hover{background:var(--accent-soft);color:var(--accent)}

.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px}
.st-pago,.st-recebido,.st-ok{color:var(--pos);background:var(--pos-soft)}
.st-aberto,.st-avencer{color:var(--accent);background:var(--accent-soft)}
.st-vencido,.st-atraso,.st-erro{color:var(--neg);background:var(--neg-soft)}
.st-pend,.st-parcial{color:var(--warn);background:var(--warn-soft)}
.st-neutro{color:var(--text2);background:var(--bg)}

/* ---------- Charts ---------- */
.chart-box{width:100%;overflow:hidden}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);padding:0 18px 4px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.axis-lbl{font-size:10px;fill:var(--text2)}
.grid-line{stroke:var(--border);stroke-width:1;stroke-dasharray:2 3}

/* ---------- Drawer / Modal ---------- */
#overlay{position:fixed;inset:0;background:rgba(16,24,40,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#overlay.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:-560px;width:540px;max-width:94vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:50;transition:right .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#drawer.on{right:0}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.drawer-title{font-size:15.5px;font-weight:650}
.drawer-sub{font-size:12px;color:var(--text2);margin-top:3px}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60}
#modal.on{display:flex}
.modal-card{width:680px;max-width:94vw;max-height:88vh;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;z-index:61}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--border)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}

/* ---------- Misc ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 20px;text-align:center;color:var(--text2)}
.empty .ic{width:44px;height:44px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.empty .t1{font-size:13.5px;font-weight:600;color:var(--text)}
.empty .t2{font-size:12px;margin-top:4px;max-width:300px}
.skel{background:linear-gradient(90deg,var(--border) 25%,var(--bg) 50%,var(--border) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--surface);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);transition:transform .25s;z-index:80;max-width:80vw}
#toast.on{transform:translateX(-50%) translateY(0)}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:border-color .15s,transform .15s;box-shadow:var(--shadow)}
.admin-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.admin-card .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.admin-card .t{font-size:13.5px;font-weight:600}
.admin-card .d{font-size:11.8px;color:var(--text2);margin-top:4px;line-height:1.45}
.alert-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.alert-item:last-child{border-bottom:none}
.alert-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.alert-t{font-size:12.5px;font-weight:600}
.alert-d{font-size:11.5px;color:var(--text2);margin-top:2px;line-height:1.45}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--text)}
.field input[type=text],.field input[type=color],.field select{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
.switch{position:relative;width:38px;height:22px;background:var(--border);border-radius:999px;transition:background .15s;flex:none;cursor:pointer}
.switch.on{background:var(--accent)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on::after{left:19px}
.aging-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:10px 0 14px}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1.5px solid var(--border);color:var(--text2);flex:none;background:var(--surface)}
.step-dot.done{background:var(--pos);border-color:var(--pos);color:#fff}
.step-dot.cur{border-color:var(--accent);color:var(--accent)}
.step-line{flex:1;height:1.5px;background:var(--border)}
.dre-cfg{display:grid;grid-template-columns:1fr 1.35fr;gap:16px}
@media(max-width:1100px){.dre-cfg{grid-template-columns:1fr}}
.cfg-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;background:var(--surface);font-size:12.5px}
.cfg-item:hover{border-color:var(--accent)}
.cfg-item .mv{display:flex;gap:2px}
.cfg-item .mv button{width:20px;height:20px;border-radius:5px;border:1px solid var(--border);font-size:11px;color:var(--text2);line-height:1}
.cfg-item .mv button:hover{color:var(--accent);border-color:var(--accent)}
.mini-sel{padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:11px;background:var(--surface);color:var(--text2)}
.perm-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
@media print{#sidebar,#topbar,.page-actions{display:none}}
</style>
</head>
<body>
<div id="loginGate" style="display:none">
  <form class="login-card" id="loginForm">
    <div class="brand-mark">PE</div>
    <h1>Painel Executivo Financeiro</h1>
    <p>Entre com sua conta para acessar o painel.</p>
    <div class="login-field"><label for="loginEmail">E-mail</label><input type="email" id="loginEmail" autocomplete="username" required></div>
    <div class="login-field"><label for="loginPassword">Senha</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>
    <button type="submit" class="btn primary" id="loginBtn">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </form>
</div>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <header id="topbar"></header>
    <main id="content"></main>
  </div>
</div>
<div id="overlay" onclick="closeAllPanels()"></div>
<aside id="drawer"></aside>
<div id="modal"><div class="modal-card" id="modalCard"></div></div>
<div id="toast"></div>
<script>
/* =====================================================================
   PAINEL EXECUTIVO FINANCEIRO — Protótipo funcional
   Plano de Contas: estrutura REAL importada de "Plano de Contas - Agibens.xlsx".
   Valores mensais: demonstrativos (sinalizados), ancorados nas despesas fixas
   reais da aba "Despesas Fixas" onde disponíveis.
   ===================================================================== */

/* ---------- Ícones (traço estilo Lucide) ---------- */
const ICON_PATHS = {
  home:'M3 10.5 12 3l9 7.5M5.5 8.8V20h13V8.8',
  flow:'M3 17l5-6 4 3 6-8M15 6h3v3',
  file:'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6',
  gauge:'M12 14l3.5-3.5M5 19a8 8 0 1 1 14 0z',

  BASES.DUNORTE = dn;
})();

/* ---------- Geração determinística de séries mensais ---------- */
function serie(base, g, seed){
  const prev=[], real=[];
  let v = base;
  for(let m=0;m<12;m++){
    const j = 1 + .07*Math.sin(seed*3.1+m*1.7) + .035*Math.cos(seed*7.3+m*.9);
    prev.push(Math.round(v*j));
    real.push(m<=REAL_M ? Math.round(v*j*(0.93+.11*Math.abs(Math.sin(seed*5.7+m*2.3)))) : null);
    v *= (1+g);
  }
  return {prev, real};
}
const VAL = {};
Object.keys(BASES).forEach(emp=>{
  VAL[emp]={};
  analiticas().forEach(a=>{
    const b = BASES[emp][a.c];
    if(b) VAL[emp][a.c] = serie(b[0], b[1], b[2]);
  });
});

/* ---------- Motor de cálculo ---------- */
function v(code, m, reg){
  reg = reg || state.regime;
  const a = acc(code);
  if(!a) return 0;
  if(a.t==='A'){
    const s = VAL[state.empresa][code];
    if(!s) return 0;
    if(reg==='prev') return s.prev[m];
    if(reg==='real') return s.real[m]==null?0:s.real[m];
    return m<=REAL_M ? (s.real[m]==null?0:s.real[m]) : s.prev[m];
  }
  return filhos(code).reduce((t,f)=>t+v(f.c,m,reg),0);
}
function vAno(code, reg){ let t=0; for(let m=0;m<12;m++) t+=v(code,m,reg); return t; }
function vRange(code, m0, m1, reg){ let t=0; for(let m=m0;m<=m1;m++) t+=v(code,m,reg); return t; }

/* fluxo de caixa: entradas = receitas (1); saídas = custos (2) + despesas (3).
   Contas patrimoniais (4) não transitam pelo resultado. */
function fluxoMes(m, reg){
  const ent = v('1',m,reg);
  const sai = v('2',m,reg)+v('3',m,reg);
  return {ent, sai, ger:ent-sai};
}
function saldos(reg){
  const out=[]; let s = BASES[state.empresa].saldoIni;
  for(let m=0;m<12;m++){
    const f = fluxoMes(m,reg);
    out.push({ini:s, ...f, fim:s+f.ger});
    s += f.ger;
  }
  return out;
}
function saldoAtual(){ return saldos('real')[REAL_M].fim; }
function menorSaldoProj(){
  const s = saldos('proj');
  let min = Infinity, mm = 0;
  for(let m=REAL_M;m<12;m++){ if(s[m].fim<min){min=s[m].fim;mm=m;} }
  return {valor:min, mes:MESES[mm]};
}

const FORN_DRILL = ['Assist-Me','Itracker','USE Rastreamentos','Pillar Contabilidade','Dra. Maira','Débora','Hinova','Oficina Silva','AutoPeças Norte','Carteira de Associados','Seguradora Aliança','Claro / Vivo'];
function lancamentos(code, m, total){
  const n = 3 + (Math.abs(code.length*7+m*3) % 3);
  const rows=[]; let rest = total;
  for(let i=0;i<n;i++){
    const val = i===n-1 ? rest : Math.round(total*(0.15+0.2*Math.abs(Math.sin(m*3+i*5+code.length))));
    rest -= val;
    rows.push({
      data: (3+i*6)+'/'+String(m+1).padStart(2,'0')+'/2026',
      parte: FORN_DRILL[(m+i*3+code.length)%FORN_DRILL.length],
      doc:'DOC-'+(1000+m*37+i*11), valor:val,
      conta: acc(code)? acc(code).n : code,
      centro: code.startsWith('2.1')?'Sinistros':code.startsWith('2.2')?'Assistência':code.startsWith('2.3')?'Rastreamento':code.startsWith('3.1')?'Comercial':code.startsWith('3.2')?'Pessoal':code.startsWith('3.4')?'Financeiro':code.startsWith('3')?'Administrativo':'Receitas',
      status: m<=REAL_M?'Realizado':'Previsto', origem:'Importação '+(m+1<8?'31/07/2026':'planejada')
    });
  }
  return rows;
}

/* ---------- Formatação ---------- */
const fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const fmtBRL2 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
function money(x, dec){ return (dec?fmtBRL2:fmtBRL).format(x); }
function moneyHtml(x, dec, dir){
  let cls = 'money';
  if(x<0) cls += ' neg';
  else if(dir==='in' && x>0) cls += ' pos';
  return '<span class="'+cls+'">'+money(x,dec)+'</span>';
}
function kfmt(x){
  const a = Math.abs(x);
  if(a>=1e6) return (x/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';
  if(a>=1e3) return Math.round(x/1e3)+' mil';
  return String(Math.round(x));
}
function pct(x,dec){ return x.toLocaleString('pt-BR',{maximumFractionDigits:dec==null?1:dec})+'%'; }
function fdate(dt){ return dt ? dt.toLocaleDateString('pt-BR') : '—'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* =========================== GRÁFICOS (SVG) =========================== */
function yScaleInfo(min,max){
  if(min===max){min-=1;max+=1;}
  const pad=(max-min)*.12; min-=pad; max+=pad;
  if(min>0 && min<max*.3) min=0;
  return {min,max};
}
function chartSaldo(series, H){
  H=H||260; const W=760, L=52, R=14, T=16, B=26;
  const all=series.flatMap(s=>s.values.filter(v=>v!=null));
  let {min,max}=yScaleInfo(Math.min(...all,0),Math.max(...all));
  const n=series[0].values.length;
  const X=i=>L+(W-L-R)*i/Math.max(1,n-1), Y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let out='<svg class="chart-box" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  for(let g=0;g<=4;g++){
    const val=min+(max-min)*g/4, y=Y(val);
    out+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>';
    out+='<text class="axis-lbl" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(val)+'</text>';
  }
  if(min<0){ out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--neg)" stroke-width="1" stroke-dasharray="4 3" opacity=".55"/>'; }
  series[0].values.forEach((v,i)=>{
    if(n<=13 || i%2===0) out+='<text class="axis-lbl" x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+series[0].labels[i]+'</text>';
  });
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length)return;
    const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){
      out+='<path d="'+path+' L'+pts[pts.length-1][0]+' '+Y(Math.max(min,0))+' L'+pts[0][0]+' '+Y(Math.max(min,0))+' Z" fill="'+s.color+'" opacity=".09"/>';
    }
    out+='<path d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||2.2)+'"'+(s.dash?' stroke-dasharray="5 4"':'')+' stroke-linecap="round"/>';
    if(s.dots){
      s.values.forEach((v,i)=>{ if(v==null)return;
        const negv=v<0;
        out+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(negv?4:3)+'" fill="'+(negv?'var(--neg)':s.color)+'" stroke="var(--surface)" stroke-width="1.5"><title>'+series[0].labels[i]+': '+money(v)+'</title></circle>';
      });
    }
  });
  return out+'</svg>';
}
function chartBars(labels, groups, H){
  H=H||230; const W=760, L=52, R=14, T=14, B=26;
  const all=groups.flatMap(g=>g.values);
  let {min,max}=yScaleInfo(Math.min(0,...all),Math.max(...all));
  const n=labels.length, slot=(W-L-R)/n, bw=Math.min(16,(slot-10)/groups.length);
  const Y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let out='<svg class="chart-box" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  for(let g=0;g<=4;g++){
    const val=min+(max-min)*g/4, y=Y(val);
    out+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>';
    out+='<text class="axis-lbl" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(val)+'</text>';
  }
  labels.forEach((lb,i)=>{
    out+='<text class="axis-lbl" x="'+(L+slot*i+slot/2)+'" y="'+(H-8)+'" text-anchor="middle">'+lb+'</text>';
    groups.forEach((g,j)=>{
      const v=g.values[i], y=Y(Math.max(v,0)), h=Math.abs(Y(v)-Y(0));
      const x=L+slot*i+slot/2-(bw*groups.length+2*(groups.length-1))/2+j*(bw+2);
      out+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="3" fill="'+g.color+'" opacity="'+(g.opacity||1)+'"><title>'+lb+' — '+g.name+': '+money(v)+'</title></rect>';
    });
  });
  return out+'</svg>';
}
function chartStacked(labels, series, H){
  H=H||230; const W=760, L=52, R=14, T=14, B=26;
  const totals=labels.map((_,i)=>series.reduce((t,s)=>t+Math.max(0,s.values[i]),0));
  let {min,max}=yScaleInfo(0,Math.max(...totals));
  const n=labels.length, slot=(W-L-R)/n, bw=Math.min(26,slot-12);
  const Y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let out='<svg class="chart-box" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  for(let g=0;g<=4;g++){
    const val=min+(max-min)*g/4, y=Y(val);
    out+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>';
    out+='<text class="axis-lbl" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(val)+'</text>';
  }
  labels.forEach((lb,i)=>{
    out+='<text class="axis-lbl" x="'+(L+slot*i+slot/2)+'" y="'+(H-8)+'" text-anchor="middle">'+lb+'</text>';
    let acc2=0;
    series.forEach(s=>{
      const v=Math.max(0,s.values[i]); if(!v)return;
      const y1=Y(acc2), y2=Y(acc2+v);
      out+='<rect x="'+(L+slot*i+slot/2-bw/2)+'" y="'+y2+'" width="'+bw+'" height="'+Math.max(y1-y2,1)+'" rx="2.5" fill="'+s.color+'"><title>'+lb+' — '+s.name+': '+money(v)+'</title></rect>';
      acc2+=v;
    });
  });
  return out+'</svg>';
}
function chartDonut(items, H, pie){
  H=H||210; const cx=105, cy=H/2, r=Math.min(78,H/2-14), ir=pie?0:r*.62;
  const tot=items.reduce((t,i)=>t+Math.max(0,i.value),0)||1;
  let a0=-Math.PI/2, out='<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg width="210" height="'+H+'" viewBox="0 0 210 '+H+'">';
  items.forEach(it=>{
    const frac=Math.max(0,it.value)/tot; if(frac<=0)return;
    const a1=a0+frac*2*Math.PI, large=frac>.5?1:0;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    if(pie){
      out+='<path d="M'+cx+' '+cy+' L'+x0+' '+y0+' A'+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' Z" fill="'+it.color+'" stroke="var(--surface)" stroke-width="1.5"><title>'+it.name+': '+money(it.value)+' ('+pct(frac*100)+')</title></path>';
    } else {
      const xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1), xi0=cx+ir*Math.cos(a0), yi0=cy+ir*Math.sin(a0);
      out+='<path d="M'+x0+' '+y0+' A'+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' L'+xi1+' '+yi1+' A'+ir+' '+ir+' 0 '+large+' 0 '+xi0+' '+yi0+' Z" fill="'+it.color+'" stroke="var(--surface)" stroke-width="1.5"><title>'+it.name+': '+money(it.value)+' ('+pct(frac*100)+')</title></path>';
    }
    a0=a1;
  });
  out+='</svg><div style="flex:1;min-width:150px">';
  items.forEach(it=>{
    out+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px"><i style="width:9px;height:9px;border-radius:3px;background:'+it.color+';display:inline-block"></i><span style="flex:1;color:var(--text2)">'+it.name+'</span><span style="font-weight:600" class="money">'+money(it.value)+'</span><span style="color:var(--text2);width:44px;text-align:right">'+pct(Math.max(0,it.value)/tot*100,0)+'</span></div>';
  });
  return out+'</div></div>';
}
function chartWaterfall(steps, H){
  H=H||240; const W=760, L=56, R=14, T=16, B=40;
  let run=0; const pts=steps.map(s=>{ const st={...s}; st.from=s.total? 0:run; run=s.total? s.value : run+s.value; st.to=s.total? s.value : st.from+s.value; return st; });
  const all=pts.flatMap(p=>[p.from,p.to,0]);
  let {min,max}=yScaleInfo(Math.min(...all),Math.max(...all));
  const n=steps.length, slot=(W-L-R)/n, bw=Math.min(52,slot-16);
  const Y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let out='<svg class="chart-box" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  for(let g=0;g<=4;g++){
    const val=min+(max-min)*g/4, y=Y(val);
    out+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>';
    out+='<text class="axis-lbl" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(val)+'</text>';
  }
  pts.forEach((p,i)=>{
    const x=L+slot*i+slot/2-bw/2, y1=Y(Math.max(p.from,p.to)), h=Math.max(Math.abs(Y(p.from)-Y(p.to)),2);
    const color=p.total?'var(--accent)':(p.value>=0?'var(--pos)':'var(--neg)');
    out+='<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+color+'" opacity="'+(p.total?1:.85)+'"><title>'+p.name+': '+money(p.total?p.value:p.value)+'</title></rect>';
    if(i<n-1) out+='<line x1="'+(x+bw)+'" y1="'+Y(p.to)+'" x2="'+(L+slot*(i+1)+slot/2-bw/2)+'" y2="'+Y(p.to)+'" stroke="var(--text2)" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>';
    const words=p.name.split(' ');
    out+='<text class="axis-lbl" x="'+(x+bw/2)+'" y="'+(H-24)+'" text-anchor="middle">'+words[0]+'</text>';
    if(words.length>1) out+='<text class="axis-lbl" x="'+(x+bw/2)+'" y="'+(H-13)+'" text-anchor="middle">'+words.slice(1).join(' ')+'</text>';
  });
  return out+'</svg>';
}
function chartRanking(items, fmt){

}

  h+='</div><div class="drawer-foot"><button class="btn" onclick="limparFiltros()">Limpar filtros</button><button class="btn primary" onclick="closeDrawer()">Aplicar</button></div>';

}
function addFiltro(k,vv){
  if(!vv)return;
  if(k==='Empresa'){ setEmpresa(vv==='Agibens'?'AGIBENS':'DUNORTE'); return; }
  state.filtros=state.filtros.filter(f=>f.k!==k);
  state.filtros.push({k,v:vv});
  render();
}
function rmFiltro(i){
  const f=state.filtros[i];
  if(f.k==='Período'){ toast('O período é um filtro obrigatório — ajuste pelo seletor de período'); return; }
  state.filtros.splice(i,1);
  render();
}
function limparFiltros(){ state.filtros=state.filtros.filter(f=>f.k==='Período'); closeDrawer(); render(); }
function setRegime(r){ state.regime=r; openFiltros(); render(); }
function chipsHtml(){
  if(!state.filtros.length)return '';
  return '<div class="chips">'+state.filtros.map((f,i)=>
    '<span class="chip">'+f.k+': '+esc(f.v)+(f.k==='Período'?'':'<button onclick="rmFiltro('+i+')">&times;</button>')+'</span>').join('')+'</div>';
}
const REGIME_LBL={prev:'Previsto',real:'Realizado',pxr:'Previsto x Realizado',proj:'Projetado'};

/* =========================== DRILL-DOWN =========================== */
function drill(code, m, reg){
  reg=reg||state.regime;
  const a=acc(code), total=v(code,m,reg==='pxr'?'proj':reg);
  const rows=lancamentos(code,m,total);
  let h=drawerHead(a?a.n:code, MESES[m]+'/2026 — '+(REGIME_LBL[reg]||'')+' — total '+money(total));
  h+='<div class="drawer-body"><div class="demo-tag" style="margin-bottom:14px">'+icon('alert',12)+' Lançamentos demonstrativos</div>';
  h+='<table class="tbl"><thead><tr><th>Data</th><th>Fornecedor / Cliente</th><th>Documento</th><th class="num">Valor</th><th>Status</th></tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr class="hoverable" onclick="drillLanc(\''+esc(r.parte)+'\',\''+r.doc+'\','+r.valor+',\''+r.conta.replace(/'/g,'')+'\',\''+r.centro+'\',\''+r.status+'\',\''+r.data+'\')">'+
       '<td>'+r.data+'</td><td>'+esc(r.parte)+'</td><td style="color:var(--text2)">'+r.doc+'</td>'+
       '<td class="num">'+moneyHtml(r.valor)+'</td>'+
       '<td><span class="status-badge '+(r.status==='Realizado'?'st-ok':'st-aberto')+'">'+r.status+'</span></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="drawer-foot"><button class="btn" onclick="toast(\'Exportação demonstrativa — CSV gerado\')">'+icon('download',14)+' Exportar CSV</button></div>';
  openDrawer(h);
}
function drillLanc(parte,doc,valor,conta,centro,status,data){
  let h=drawerHead('Lançamento '+doc, parte);
  const li=(k,vv)=>'<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">'+k+'</span><span style="font-weight:500">'+vv+'</span></div>';
  h+='<div class="drawer-body"><div class="demo-tag" style="margin-bottom:14px">'+icon('alert',12)+' Dado demonstrativo</div>';
  h+=li('Data',data)+li('Fornecedor / Cliente',esc(parte))+li('Documento',doc)+li('Descrição','Lançamento vinculado à conta analítica')+
     li('Valor',money(valor,true))+li('Conta analítica',esc(conta))+li('Centro de resultado',centro)+
     li('Status',status)+li('Origem','Importação de planilha')+li('Observação','—');
  h+='</div><div class="drawer-foot"><button class="btn" onclick="closeDrawer()">Fechar</button></div>';
  openDrawer(h);
}

/* =========================== EXPORTAÇÃO / NOTIFICAÇÕES =========================== */
function openExport(){
  const areas=['Dashboard','Fluxo de Caixa','DRE','Contas a Pagar','Contas a Receber','Indicadores','Pendências de importação'];
  let h=drawerHead('Exportar','Gera arquivos com identidade institucional');
  h+='<div class="drawer-body">';
  areas.forEach(a=>{
    h+='<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)">'+
       '<span style="flex:1;font-size:13px;font-weight:500">'+a+'</span>'+
       ['PDF','Excel','CSV'].map(fmt=>'<button class="btn sm" onclick="toast(\'Exportação demonstrativa — '+a+' ('+fmt+')\')">'+fmt+'</button>').join('')+'</div>';
  });
  h+='</div>';
  openDrawer(h);
}
function alertas(){
  const out=[];
  const venc=PAGAR[state.empresa].filter(p=>p.status==='Vencido');
  if(venc.length) out.push({tipo:'neg', t:venc.length+' conta(s) a pagar vencida(s)', d:'Total de '+money(venc.reduce((t,p)=>t+p.vprev,0))+' em atraso. Priorizar regularização para evitar juros e multas (há encargos sociais vencidos).'});
  const inad=RECEBER[state.empresa].filter(r=>r.status==='Vencido');
  if(inad.length) out.push({tipo:'warn', t:'Inadimplência de '+money(inad.reduce((t,r)=>t+r.vprev,0)), d:inad.length+' título(s) vencido(s) na carteira. Acionar régua de cobrança.'});
  const sp=saldos('proj'); const negMeses=[];
  for(let m=REAL_M;m<12;m++) if(sp[m].fim<0) negMeses.push(MESES[m]);
  if(negMeses.length) out.push({tipo:'neg', t:'Saldo projetado negativo em '+negMeses.join(', '), d:'Menor saldo projetado: '+money(menorSaldoProj().valor)+'. Avaliar antecipação de recebíveis ou postergação de saídas.'});
  const ms=menorSaldoProj();
  if(!negMeses.length) out.push({tipo:'ok', t:'Caixa projetado positivo até Dez/2026', d:'Menor saldo projetado: '+money(ms.valor)+' em '+ms.mes+'.'});
  const a=ASSOC[state.empresa];
  if(a && a.inadimplencia>13) out.push({tipo:'warn', t:'Inadimplência de associados em '+pct(a.inadimplencia), d:'Acima do limite de referência de 13%. Reforçar recuperação de boletos vencidos.'});
  return out;
}
function openNotifs(){
  let h=drawerHead('Notificações','Alertas gerados automaticamente a partir da base');
  h+='<div class="drawer-body">'+alertasHtml(alertas())+'</div>';
  openDrawer(h);
}
function alertasHtml(list){
  if(!list.length) return '<div class="empty"><div class="ic">'+icon('check')+'</div><div class="t1">Nenhum alerta</div><div class="t2">A base atual não gerou alertas financeiros.</div></div>';
  return list.map(a=>{
    const cor=a.tipo==='neg'?'var(--neg)':a.tipo==='warn'?'var(--warn)':'var(--pos)';
    const bg=a.tipo==='neg'?'var(--neg-soft)':a.tipo==='warn'?'var(--warn-soft)':'var(--pos-soft)';
    return '<div class="alert-item"><div class="alert-ic" style="background:'+bg+';color:'+cor+'">'+icon(a.tipo==='ok'?'check':'alert',15)+'</div>'+
      '<div><div class="alert-t">'+a.t+'</div><div class="alert-d">'+a.d+'</div></div></div>';
  }).join('');
}

/* =========================== PAGE HEAD / KPI =========================== */
function pageHead(title, sub, extra){
  const e=EMPRESAS[state.empresa];
  const demoTag = state.empresa==='AGIBENS' ? '' : '<span class="demo-tag">'+icon('alert',12)+' Dados demonstrativos</span>';
  return '<div class="page-head"><div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="page-title">'+title+'</span>'+
    demoTag+'</div>'+
    '<div class="page-sub">'+e.nome+' &middot; '+esc(state.periodoLabel)+'</div></div>'+
    '<div class="page-actions">'+(extra||'')+'</div></div>'+chipsHtml();
}
function kpi(lb, val, delta, legenda, colorClass){
  let dhtml='';
  if(delta!=null){
    const up=delta>=0;
    dhtml='<span class="delta '+(up?'up':'down')+'">'+(up?'&#9650;':'&#9660;')+' '+pct(Math.abs(delta))+'</span>';
  }
  return '<div class="kpi"><div class="lb">'+lb+'</div><div class="vl '+(colorClass||'')+'">'+val+'</div>'+
    (dhtml?'<div class="dl">'+dhtml+'</div>':'')+'</div>';
}
function assocCards(compact){
  if(typeof CFG_IND!=='undefined' && !CFG_IND[state.empresa].assoc) return '';
  const a=ASSOC[state.empresa];
  const items=[
    ['Associados Ativos', a.ativos!=null?a.ativos.toLocaleString('pt-BR'):null,'de '+(a.associados!=null?a.associados.toLocaleString('pt-BR'):'—')+' cadastrados'],
    ['Novos no mês', a.novos!=null?'+'+a.novos:null,'Julho/2026'],
    ['Churn', a.churn!=null?pct(a.churn):null,'cancelamentos / base ativa'],
    ['Ticket Médio', a.ticketMedio!=null?money(a.ticketMedio,true):null,'receita média por associado'],
    ['Índice de Sinistralidade', a.sinistralidade!=null?pct(a.sinistralidade):null,'custo de sinistros / receita'],
    ['Inadimplência', a.inadimplencia!=null?pct(a.inadimplencia):null,'boletos vencidos / emitidos']
  ].filter(i=>i[1]!=null);
  let h='<div class="card"><div class="card-head"><div style="flex:1"><div class="card-title">Indicadores da Associação</div></div>'+
    '<button class="btn sm ghost" onclick="go(\'indicadores\')">Ver todos '+icon('chevR',13)+'</button></div><div class="card-body">';
  h+='<div class="kpi-grid" style="margin-bottom:0">';
  items.slice(0,compact?6:items.length).forEach(i=>{ h+=kpi(i[0], i[1], null, i[2]); });
  h+='</div>';
  return h+'</div></div>';
}
</script>
<script>
/* =========================== FLUXO DE CAIXA =========================== */
const expandState = {fluxo:{}, dre:{}, sp:{}};
function toggleRow(scope,id){ expandState[scope][id]=!expandState[scope][id]; render(); }
function mkNode(code){ const k=filhos(code); return k.length?{code,kids:k.map(f=>mkNode(f.c))}:{code}; }
function fluxoTreeDef(){
  return [
    {id:'Entradas', label:'Entradas', kind:'ent', kids:filhos('1').map(f=>mkNode(f.c))},
    {id:'Saídas',  label:'Saídas',  kind:'sai', kids:[mkNode('2'), mkNode('3')]}
  ];
}
function fluxoColunas(){
  const sel=MSEL(), m0=sel[0], m1=sel[sel.length-1];
  const p=state.fluxoPeriodo;
  if(p==='mensal') return sel.map(m=>({label:MESES[m],m}));
  if(p==='trimestral'){
    const cols=[]; for(let t=0;t<4;t++){ const a=t*3,b=t*3+2; if(b>=m0&&a<=m1) cols.push({label:(t+1)+'º Tri',m0:a,m1:b}); } return cols;
  }
  if(p==='anual') return [{label:'2026',m0:m0,m1:m1}];
  if(p==='semanal'){
    const cols=[]; const fr=[.22,.26,.24,.28];
    for(let w=0;w<8;w++){ const m=Math.min(11,6+Math.floor(w/4)); cols.push({label:'Sem '+(w+1)+'<br><span style="font-weight:400">'+MESES[m]+'</span>',m,frac:fr[w%4]}); }
    return cols;
  }
  const cols=[]; for(let i=0;i<10;i++){ cols.push({label:(3+i)+'/08',m:7,frac:.05}); }
  return cols;
}
function colVal(code,col,reg){
  if(col.frac!=null) return Math.round(v(code,col.m,reg)*col.frac);
  if(col.m!=null) return v(code,col.m,reg);
  return vRange(code,col.m0,col.m1,reg);
}
function colFluxo(col,reg){
  const ent=colVal('1',col,reg);
  const sai=colVal('2',col,reg)+colVal('3',col,reg);
  return {ent,sai,ger:ent-sai};
}
function cellHtml(val, prevVal, clickCode, colIdx, dir){
  const showPxr = state.regime==='pxr' && prevVal!=null;
  const cls = 'num'+(clickCode?' clickv':'');
  const click = clickCode?' onclick="drillCol(\''+clickCode+'\','+colIdx+')"':'';
  let inner = moneyHtml(val, true, dir);
  if(showPxr) inner += '<div style="font-size:10px;color:var(--text2)">P: '+kfmt(prevVal)+'</div>';
  return '<td class="'+cls+'"'+click+'>'+inner+'</td>';
}
let FLUXO_COLS=[];
function drillCol(code,ci){
  const col=FLUXO_COLS[ci];
  drill(code, col.m!=null?col.m:col.m0);
}
function renderFluxo(){
  const reg = state.regime==='pxr'?'proj':state.regime;
  const cols = fluxoColunas(); FLUXO_COLS=cols;
  const salAll = saldos(reg);
  const flx = cols.map(c=>colFluxo(c,reg));
  const saldosCol=[]; let chainS=null;
  cols.forEach((c,i)=>{
    let ini,fim;
    if(c.frac!=null){ if(i===0) chainS=salAll[c.m].ini; ini=chainS; fim=ini+flx[i].ger; chainS=fim; }
    else if(c.m!=null){ ini=salAll[c.m].ini; fim=salAll[c.m].fim; }
    else { ini=salAll[c.m0].ini; fim=salAll[c.m1].fim; }
    saldosCol.push({ini,fim});
  });
  const saldo0=saldosCol[0].ini;
  const totalEnt=flx.reduce((t,f)=>t+f.ent,0), totalSai=flx.reduce((t,f)=>t+f.sai,0);
  const ms=menorSaldoProj();
  const maiorSai=Math.max(...flx.map(f=>f.sai)), maiorEnt=Math.max(...flx.map(f=>f.ent));

  let h=pageHead('Fluxo de Caixa','');
  h+='<div class="kpi-grid">';
  h+=kpi('Saldo Inicial',money(saldo0,true),null,'início do período');
  h+=kpi('Entradas',money(totalEnt,true),null,'no período','pos');
  h+=kpi('Saídas',money(totalSai,true),null,'no período');
  h+=kpi('Geração de Caixa',money(totalEnt-totalSai,true),null,'entradas − saídas',totalEnt-totalSai<0?'neg':'pos');
  h+=kpi('Saldo Final',money(saldosCol[saldosCol.length-1].fim,true),null,'fim do período',saldosCol[saldosCol.length-1].fim<0?'neg':'');
  h+=kpi('Menor Saldo Projetado',money(ms.valor,true),null,'em '+ms.mes+'/2026',ms.valor<0?'neg':'');
  h+='</div>';

  h+='<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center">';
  h+='<div class="seg">'+[['prev','Previsto'],['real','Realizado'],['pxr','Previsto x Realizado'],['proj','Projetado']].map(r=>
     '<button class="'+(state.regime===r[0]?'on':'')+'" onclick="state.regime=\''+r[0]+'\';render()">'+r[1]+'</button>').join('')+'</div>';
  h+='<div class="seg">'+[['diario','Diário'],['semanal','Semanal'],['mensal','Mensal'],['trimestral','Trimestral'],['anual','Anual']].map(p=>
     '<button class="'+(state.fluxoPeriodo===p[0]?'on':'')+'" onclick="state.fluxoPeriodo=\''+p[0]+'\';render()">'+p[1]+'</button>').join('')+'</div>';
  h+='</div>';

  const lbls=cols.map(c=>c.label.replace(/<br>.*/,''));
  const prevGer=cols.map(c=>colFluxo(c,'prev').ger);
  h+=chartCard({
    id:'evolucao', title:'Evolução do Saldo',
    trend: pctChange(totalEnt-totalSai, prevGer.reduce((t,x)=>t+x,0)),
    body: pcLineArea('flx', lbls, [
      {name:'Saldo final', values:saldosCol.map(x=>x.fim), kind:'main', area:true, dots:true},
      {name:'Entradas', values:flx.map(f=>f.ent), kind:'ghost'},
      {name:'Saídas', values:flx.map(f=>f.sai), kind:'ghost2'}
    ], {h:300, click:'fluxoChartDrill'})
  });

  h+=saldosProjetadosCard();

  h+='<div class="card" style="margin-top:16px"><div class="card-head"><div class="card-title">Demonstrativo do Fluxo</div></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="min-width:250px">Descrição</th>';
  cols.forEach(c=>h+='<th class="num">'+c.label+'</th>');
  h+='<th class="num">Total</th></tr></thead><tbody>';
  h+='<tr class="row-total"><td>Saldo Inicial</td>'+saldosCol.map(x=>'<td class="num">'+moneyHtml(x.ini,true)+'</td>').join('')+'<td class="num">'+moneyHtml(saldo0,true)+'</td></tr>';

  function rowFor(node, level){
    const a=node.code?acc(node.code):null;
    const id=node.id||node.code;
    const label=node.label||(a?a.n:id);
    const open=!!expandState.fluxo[id];
    const hasKids=node.kids&&node.kids.length;
    let vals; let dir=null;
    if(node.kind==='ent'){ vals=flx.map(f=>f.ent); dir='in'; }
    else if(node.kind==='sai'){ vals=flx.map(f=>f.sai); }
    else { vals=cols.map(c=>colVal(node.code,c, state.regime==='pxr'?'proj':reg)); if(node.code&&node.code[0]==='1') dir='in'; }
    const total=vals.reduce((t,x)=>t+x,0);
    let hh='<tr class="lvl'+Math.min(level,3)+(level===0?' row-sub':'')+'"><td><span class="tree-lbl">'+
      (hasKids?'<button class="tree-toggle" onclick="toggleRow(\'fluxo\',\''+id+'\')">'+(open?'&minus;':'+')+'</button>':'<span style="width:26px;display:inline-block"></span>')+
      esc(label)+'</span></td>';
    vals.forEach((vv,ci)=>{
      const pv = state.regime==='pxr' ? (node.code?colVal(node.code,cols[ci],'prev'):colFluxo(cols[ci],'prev')[node.kind==='ent'?'ent':'sai']) : null;
      hh+=cellHtml(vv,pv,node.code||null,ci,dir);
    });
    hh+='<td class="num" style="font-weight:600">'+moneyHtml(total,true,dir)+'</td></tr>';
    if(hasKids&&open) node.kids.forEach(k=>hh+=rowFor(k,level+1));
    return hh;
  }
  fluxoTreeDef().forEach(n=>h+=rowFor(n,0));
  h+='<tr class="row-sub"><td>Geração de Caixa</td>'+flx.map(f=>'<td class="num">'+moneyHtml(f.ger,true)+'</td>').join('')+'<td class="num">'+moneyHtml(totalEnt-totalSai,true)+'</td></tr>';
  h+='<tr class="row-total"><td>Saldo Final</td>'+saldosCol.map(x=>'<td class="num">'+moneyHtml(x.fim,true)+'</td>').join('')+'<td class="num">'+moneyHtml(saldosCol[saldosCol.length-1].fim,true)+'</td></tr>';
  h+='</tbody></table></div></div>';
  $('content').innerHTML=h;
}
function fluxoChartDrill(i){ const c=FLUXO_COLS[i]; if(c) drill('1', c.m!=null?c.m:c.m0); }

/* ---------- Saldos Projetados por vencimento (fluxo previsto diário) ---------- */
state.spDias = state.spDias||30;
state.spStatus = state.spStatus||'Todos';
function spToggle(k){ expandState.sp[k]=!expandState.sp[k]; render(); }
function spLinhas(){
  const ini = state.spIni ? new Date(state.spIni+'T00:00:00') : new Date(2026,7,1);
  const fim = state.spFim ? new Date(state.spFim+'T00:00:00') : new Date(ini.getTime()+(state.spDias||30)*86400000);
  const items=[];
  PAGAR[state.empresa].filter(t=>t.status!=='Pago').forEach(t=>items.push({t, tipo:'pagar', nome:t.forn, valor:-t.vprev, venc:t.venc, vencido:t.status==='Vencido'}));
  RECEBER[state.empresa].filter(t=>t.status!=='Recebido').forEach(t=>items.push({t, tipo:'receber', nome:t.cli, valor:t.vprev, venc:t.venc, vencido:t.status==='Vencido'}));
  const byDay={};
  items.forEach(it=>{
    if(state.spStatus==='Em aberto'&&it.vencido)return;
    if(state.spStatus==='Vencidos'&&!it.vencido)return;
    const eff=it.venc<ini?ini:it.venc;               // vencidos rolam para o primeiro dia
    if(eff>fim)return;
    const k=eff.toISOString().slice(0,10);
    (byDay[k]=byDay[k]||{data:eff, rolado:it.venc<ini, itens:[]}).itens.push(it);
  });
  const dias=Object.values(byDay).sort((a,b)=>a.data-b.data);
  let saldo=saldoAtual();
  dias.forEach(dObj=>{
    // Recebíveis vencidos ficam listados (para visibilidade), mas não entram na
    // soma do dia nem no saldo projetado — o recebimento não é garantido.
    const contaveis=dObj.itens.filter(i=>!(i.tipo==='receber'&&i.vencido));
    dObj.ent=contaveis.filter(i=>i.valor>0).reduce((t,i)=>t+i.valor,0);
    dObj.sai=contaveis.filter(i=>i.valor<0).reduce((t,i)=>t-i.valor,0);
    dObj.ger=dObj.ent-dObj.sai;
    saldo+=dObj.ger;
    dObj.saldo=saldo;
  });
  return dias;
}
function saldosProjetadosCard(){
  const dias=spLinhas();
  const gerTot=dias.reduce((t,d2)=>t+d2.ger,0);
  const saldoFinal=dias.length?dias[dias.length-1].saldo:saldoAtual();
  let h='<div class="card" style="margin-top:16px"><div class="pc-head"><div style="flex:1;min-width:220px"><div class="pc-title">Saldos Projetados</div></div>'+
    '<div class="pc-actions">'+
    '<span style="font-size:12px;font-weight:600;color:var(--text2)">De</span>'+
    '<input type="date" class="select" value="'+(state.spIni||'2026-08-01')+'" onchange="state.spIni=this.value;render()">'+
    '<span style="font-size:12px;font-weight:600;color:var(--text2)">Até</span>'+
    '<input type="date" class="select" value="'+(state.spFim||'')+'" onchange="state.spFim=this.value;state.spDias=null;render()">'+
    '<span style="font-size:12px;font-weight:600;color:var(--text2)">Dias</span>'+
    '<select class="select" onchange="state.spDias=parseInt(this.value,10);state.spFim=null;render()"><option value=""'+(state.spDias?'':' selected')+'></option>'+[30,60,90].map(d2=>'<option value="'+d2+'"'+(state.spDias===d2?' selected':'')+'>'+d2+' dias</option>').join('')+'</select>'+
    '<span style="font-size:12px;font-weight:600;color:var(--text2)">Base</span><select class="select" disabled><option>Vencimento</option></select>'+

/* =========================== DRE =========================== */
function renderDre(){
  const reg = state.regime==='pxr'?'proj':state.regime;
  const meses=MSEL();
  const cfg=DRE_CFG[state.empresa].filter(l=>l.ativa);
  let h=pageHead('DRE Gerencial','',
    PERFIS[state.role].configurar?'<button class="btn sm ghost" onclick="goAdmin(\'dre\')">'+icon('sliders',14)+' Configurar DRE</button>':'');
  h+='<div class="card"><div class="tbl-wrap" style="max-height:calc(100vh - 235px)"><table class="tbl"><thead><tr><th style="min-width:260px">Descrição</th>';
  meses.forEach(m=>h+='<th class="num">'+MESES[m]+'</th>');
  h+='<th class="num">Total</th></tr></thead><tbody>';

  function grpColor(l){
    if(l.nome.indexOf('RECEITA')>=0) return 'var(--pos)';
    if(['CUSTOS','DESPESAS OPERACIONAIS','DESPESAS'].includes(l.nome)) return 'var(--neg)';
    return 'inherit';
  }
  function contaRows(code, level){
    const a=acc(code); if(!a) return '';
    const kids=filhos(code);
    const open=!!expandState.dre[code];
    const dir=code[0]==='1'?'in':null;
    let hh='<tr class="lvl'+Math.min(level,3)+'"><td><span class="tree-lbl">'+
      (kids.length?'<button class="tree-toggle" onclick="toggleRow(\'dre\',\''+code+'\')">'+(open?'&minus;':'+')+'</button>':'<span style="width:26px;display:inline-block"></span>')+
      esc(a.n)+(a.red?' <span class="status-badge st-neutro" style="margin-left:6px">redutora</span>':'')+'</span></td>';
    let tot=0;
    meses.forEach(m=>{
      const vv=v(code,m,reg); tot+=vv;
      hh+='<td class="num clickv" onclick="drill(\''+code+'\','+m+')">'+moneyHtml(vv,null,dir)+'</td>';
    });
    hh+='<td class="num" style="font-weight:600">'+moneyHtml(tot,null,dir)+'</td></tr>';
    if(kids.length&&open) kids.forEach(k=>hh+=contaRows(k.c,level+1));
    return hh;
  }
  cfg.forEach(l=>{
    if(l.tipo==='Grupo'){
      const open=!!expandState.dre[l.id];
      const dirG=l.nome.indexOf('RECEITA')>=0?'in':null;
      let tot=0;
      let hh='<tr class="lvl0"><td><span class="tree-lbl"><button class="tree-toggle" onclick="toggleRow(\'dre\',\''+l.id+'\')">'+(open?'&minus;':'+')+'</button>'+
        '<span style="color:'+grpColor(l)+';font-weight:650">'+esc(l.nome)+'</span></span></td>';
      meses.forEach(m=>{ const vv=dreLinhaVal(l,m,reg); tot+=vv;
        hh+='<td class="num clickv" onclick="drill(\''+(l.ref||'1')+'\','+m+')">'+moneyHtml(vv,null,dirG)+'</td>'; });
      hh+='<td class="num" style="font-weight:650">'+moneyHtml(tot,null,dirG)+'</td></tr>';
      h+=hh;
      if(open){
        if(l.kids){ l.kids.forEach(([c])=>{ h+=contaRows(c,1); }); }
        else filhos(l.ref).forEach(f=>{ h+=contaRows(f.c,1); });
      }
    } else {
      let tot=0;
      let hh='<tr class="row-result"><td>'+esc(l.nome)+'</td>';
      meses.forEach(m=>{ const vv=dreLinhaVal(l,m,reg); tot+=vv; hh+='<td class="num">'+moneyHtml(vv)+'</td>'; });
      hh+='<td class="num">'+moneyHtml(tot)+'</td></tr>';
      h+=hh;
    }
  });
  h+='</tbody></table></div></div>';
  $('content').innerHTML=h;
}

function detTitulo(id, tipo){
  const lista = tipo==='pagar'?PAGAR[state.empresa]:RECEBER[state.empresa];
  const t=lista.find(x=>x.id===id); if(!t)return;
  const li=(k,vv)=>'<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">'+k+'</span><span style="font-weight:500;text-align:right;max-width:60%">'+vv+'</span></div>';
  let h=drawerHead((tipo==='pagar'?'Conta a pagar ':'Conta a receber ')+t.id, esc(t.forn||t.cli));
  h+='<div class="drawer-body">'+(state.empresa==='AGIBENS'?'':'<div class="demo-tag" style="margin-bottom:14px">'+icon('alert',12)+' Dado demonstrativo</div>');
  h+=li('Status','<span class="status-badge '+stClass(t.status)+'">'+t.status+'</span>');
  h+=li('Competência',t.comp)+li('Emissão',fdate(t.emissao))+li('Vencimento',fdate(t.venc));
  h+=li(tipo==='pagar'?'Pagamento':'Recebimento',fdate(t.pgto||t.rec));
  h+=li('Documento',t.doc)+li('Descrição',esc(t.desc));
  h+=li('Conta analítica',t.conta+' — '+(acc(t.conta)?esc(acc(t.conta).n):''));
  h+=li('Centro de resultado',t.centro)+li('Conta bancária',t.banco);
  h+=li('Valor previsto',money(t.vprev,true));
  h+=li(tipo==='pagar'?'Valor pago':'Valor recebido',money(t.vpago!=null?t.vpago:(t.vrec||0),true));
  h+=li('Juros / Multa / Desconto','R$ 0,00 / R$ 0,00 / R$ 0,00');
  h+=li('Anexo','—')+li('Observação','—');
  h+='</div><div class="drawer-foot"><button class="btn" onclick="closeDrawer()">Fechar</button></div>';
  openDrawer(h);
}
function stClass(s){
  return {'Pago':'st-pago','Recebido':'st-recebido','Em aberto':'st-aberto','Vencido':'st-vencido','Parcial':'st-parcial'}[s]||'st-neutro';
}
function diasAtraso(t){ return Math.floor((HOJE - t.venc)/86400000); }
function agingBuckets(){
  return [['A vencer',t=>diasAtraso(t)<=0],['1 a 5 dias',t=>diasAtraso(t)>=1&&diasAtraso(t)<=5],['6 a 15 dias',t=>diasAtraso(t)>=6&&diasAtraso(t)<=15],['16 a 30 dias',t=>diasAtraso(t)>=16&&diasAtraso(t)<=30],['31 a 60 dias',t=>diasAtraso(t)>=31&&diasAtraso(t)<=60],['61 a 90 dias',t=>diasAtraso(t)>=61&&diasAtraso(t)<=90],['Acima de 90 dias',t=>diasAtraso(t)>90]];
}
function renderTitulos(tipo){
  const pagar = tipo==='pagar';
  const lista = pagar?pagarSel():receberSel();
  const modo = pagar?state.pagarModo:state.receberModo;
  const aberto = lista.filter(t=>t.status!=='Pago'&&t.status!=='Recebido');
  const vencidos = lista.filter(t=>t.status==='Vencido');
  const pagos = lista.filter(t=>t.status==='Pago'||t.status==='Recebido');
  const soma = a=>a.reduce((t,x)=>t+x.vprev,0);
  const prox7 = aberto.filter(t=>t.venc>HOJE && (t.venc-HOJE)/86400000<=7);
  const porParte={};
  lista.forEach(t=>{ const k=t.forn||t.cli; porParte[k]=(porParte[k]||0)+t.vprev; });
  const maior=Object.entries(porParte).sort((a,b)=>b[1]-a[1])[0]||['—',0];

  let h=pageHead(pagar?'Contas a Pagar':'Contas a Receber','');

  h+=kpi('Total vencido',money(soma(vencidos)),null,vencidos.length+' título(s)',vencidos.length?'neg':'');
  if(pagar){
    h+=kpi('Total pago no mês',money(soma(pagos)),null,'Julho/2026','pos');

  }
  h+='</div>';

  if(!pagar){
    const buckets=agingBuckets();

    const vals=buckets.map(b=>soma(aberto.filter(b[1])));
    const tot=vals.reduce((t,x)=>t+x,0)||1;
    h+='<div class="card" style="margin-bottom:16px"><div class="card-head"><div class="card-title">Aging da Carteira</div></div><div class="card-body">';
    h+='<div class="aging-bar">'+vals.map((vv,i)=>vv?'<div style="width:'+(vv/tot*100)+'%;background:'+cores[i]+'" title="'+buckets[i][0]+': '+money(vv)+'"></div>':'').join('')+'</div>';
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">';
    buckets.forEach((b,i)=>{ h+='<div><div style="font-size:11px;color:var(--text2)"><i style="display:inline-block;width:8px;height:8px;border-radius:3px;background:'+cores[i]+';margin-right:5px"></i>'+b[0]+'</div><div style="font-size:13.5px;font-weight:600;margin-top:3px">'+money(vals[i])+'</div></div>'; });
    h+='</div></div></div>';
  }

  const modos=[['lista','Lista'],['calendario','Calendário'],['venc','Por vencimento'],['parte',pagar?'Por fornecedor':'Por cliente'],['cat','Por categoria']];
  h+='<div style="margin-bottom:14px"><div class="seg">'+modos.map(mo=>
    '<button class="'+(modo===mo[0]?'on':'')+'" onclick="state.'+(pagar?'pagarModo':'receberModo')+'=\''+mo[0]+'\';render()">'+mo[1]+'</button>').join('')+'</div></div>';

  if(modo==='lista'){
    h+='<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Vencimento</th><th>'+(pagar?'Fornecedor':'Cliente')+'</th><th>Documento</th><th>Conta</th><th>Centro</th><th class="num">Valor</th><th>Status</th></tr></thead><tbody>';
    [...lista].sort((a,b)=>a.venc-b.venc).forEach(t=>{
      h+='<tr class="hoverable" onclick="detTitulo(\''+t.id+'\',\''+tipo+'\')"><td>'+fdate(t.venc)+'</td><td>'+esc(t.forn||t.cli)+'</td><td style="color:var(--text2)">'+t.doc+'</td><td style="color:var(--text2)">'+(acc(t.conta)?esc(acc(t.conta).n):t.conta)+'</td><td style="color:var(--text2)">'+t.centro+'</td><td class="num">'+moneyHtml(t.vprev,null,pagar?null:'in')+'</td><td><span class="status-badge '+stClass(t.status)+'">'+t.status+'</span></td></tr>';
    });

    ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(dd=>h+='<div style="color:var(--text2);font-weight:600;text-align:center;padding:4px">'+dd+'</div>');
    const first=new Date(2026,7,1).getDay();
    for(let i=0;i<first;i++)h+='<div></div>';
    for(let dia=1;dia<=31;dia++){
      const doDia=lista.filter(t=>t.venc.getMonth()===7&&t.venc.getDate()===dia);
      const tot=soma(doDia);
      h+='<div style="border:1px solid var(--border);border-radius:8px;min-height:58px;padding:5px 7px'+(doDia.length?';cursor:pointer':'')+'"'+(doDia.length?' onclick="detTitulo(\''+doDia[0].id+'\',\''+tipo+'\')"':'')+'>'+
         '<div style="color:var(--text2)">'+dia+'</div>'+
         (doDia.length?'<div style="font-weight:600;font-size:11.5px;margin-top:3px;color:'+(pagar?'var(--neg)':'var(--pos)')+'">'+kfmt(tot)+'</div><div style="color:var(--text2)">'+doDia.length+' título(s)</div>':'')+'</div>';
    }
    h+='</div></div></div>';
  } else {
    let grupos={};
    if(modo==='venc'){
      lista.forEach(t=>{ const k=t.status==='Vencido'?'Vencidos':(t.status==='Pago'||t.status==='Recebido')?'Liquidados':((t.venc-HOJE)/86400000<=7?'Próximos 7 dias':'Após 7 dias'); (grupos[k]=grupos[k]||[]).push(t); });
    } else if(modo==='parte'){
      lista.forEach(t=>{ const k=t.forn||t.cli; (grupos[k]=grupos[k]||[]).push(t); });
    } else {
      lista.forEach(t=>{ const root=acc(t.conta.split('.')[0]); const k=root?root.n:t.conta; (grupos[k]=grupos[k]||[]).push(t); });
    }
    h+='<div style="display:flex;flex-direction:column;gap:12px">';
    Object.entries(grupos).sort((a,b)=>soma(b[1])-soma(a[1])).forEach(([g,items])=>{
      h+='<div class="card"><div class="card-head"><div class="card-title">'+esc(g)+'</div><div style="margin-left:auto;font-weight:650;font-size:13.5px">'+money(soma(items))+'</div></div><div class="tbl-wrap"><table class="tbl"><tbody>';
      items.forEach(t=>{ h+='<tr class="hoverable" onclick="detTitulo(\''+t.id+'\',\''+tipo+'\')"><td style="width:110px">'+fdate(t.venc)+'</td><td>'+esc(t.desc)+'</td><td class="num" style="width:130px">'+moneyHtml(t.vprev,null,pagar?null:'in')+'</td><td style="width:120px"><span class="status-badge '+stClass(t.status)+'">'+t.status+'</span></td></tr>'; });
      h+='</tbody></table></div></div>';
    });
    h+='</div>';
  }
  $('content').innerHTML=h;
}

/* =========================== INDICADORES =========================== */
function renderIndicadores(){
  const reg=state.regime==='pxr'?'proj':state.regime;
  const sel=MSEL(), nMeses=sel.length;
  const cfg=DRE_CFG[state.empresa];
  const lineOr=(n,fb)=>cfg.find(l=>l.nome===n&&l.ativa)||fb||{tipo:'Resultado',expr:[]};
  const sum=l=>sumSel(m=>dreLinhaVal(l,m,reg));
  const lRB=lineOr('RECEITA BRUTA');
  const rb=sum(lRB), rl=sum(lineOr('RECEITA LÍQUIDA',lRB)), lb=sum(lineOr('LUCRO BRUTO')),
        eb=sum(lineOr('EBITDA')), res=sum(lineOr('RESULTADO LÍQUIDO'));
  const custos=sumSel(m=>v('2',m,reg)), despesas=sumSel(m=>v('3',m,reg));
  const sAtual=saldoAtual(), sProj=saldos('proj')[11].fim, ms=menorSaldoProj();
  const mediaSaidas=sumSel(m=>fluxoMes(m,reg).sai)/Math.max(1,nMeses);
  const ger=sumSel(m=>fluxoMes(m,reg).ger);

  const abertoR=receberSel().filter(t=>t.status!=='Recebido');
  const somaT=a=>a.reduce((t,x)=>t+x.vprev,0);
  const cg=sAtual+somaT(abertoR)-somaT(abertoP);
  const vencR=receberSel().filter(t=>t.status==='Vencido');

  const pmr=Math.round(RECEBER[state.empresa].filter(t=>t.rec).reduce((t,x)=>t+(x.rec-x.emissao)/86400000,0)/Math.max(1,RECEBER[state.empresa].filter(t=>t.rec).length));

  let h=pageHead('Indicadores','');
  function grupo(t,items){

  h+=grupo('Caixa',[
    ['Saldo Atual',money(sAtual),'consolidado bancário'],

    ['Geração de Caixa',money(ger),'no período',ger<0?'neg':'pos'],
    ['Cobertura de Caixa',(sAtual/mediaSaidas).toLocaleString('pt-BR',{maximumFractionDigits:1})+' meses','saldo / média de saídas'],
    ['Capital de Giro',money(cg),'caixa + a receber − a pagar',cg<0?'neg':''],
    ['Menor Saldo Projetado',money(ms.valor),'em '+ms.mes+'/2026',ms.valor<0?'neg':'']
  ]);
  h+=grupo('Resultado',[
    ['Receita Bruta',money(rb)],['Receita Líquida',money(rl),'sem deduções cadastradas'],
    ['Custos',money(custos)],['Despesas',money(despesas)],
    ['Lucro Bruto',money(lb),'',lb<0?'neg':''],['EBITDA',money(eb),'',eb<0?'neg':'pos'],
    ['Resultado Líquido',money(res),'',res<0?'neg':'pos'],
    ['Margem Bruta',pct(lb/rl*100),'lucro bruto / receita'],
    ['Margem EBITDA',pct(eb/rl*100),'EBITDA / receita',eb<0?'neg':''],
    ['Margem Líquida',pct(res/rl*100),'resultado / receita',res<0?'neg':'']
  ]);
  h+=grupo('Pagamentos e Recebimentos',[
    ['Total a Pagar',money(somaT(abertoP)),abertoP.length+' título(s) em aberto'],
    ['Total a Receber',money(somaT(abertoR)),abertoR.length+' título(s) em aberto'],
    ['Atrasos (pagar)',money(somaT(pagarSel().filter(t=>t.status==='Vencido'))),'','neg'],
    ['Inadimplência',pct(inad),'vencidos / carteira',inad>12?'neg':''],
    ['Adimplência',pct(100-inad),'','pos'],
    ['Prazo Médio de Pagamento',pmp+' dias','emissão até pagamento'],
    ['Prazo Médio de Recebimento',pmr+' dias','emissão até recebimento']
  ]);
  const a=ASSOC[state.empresa];
  const assocItems=[
    ['Total de Associados',a.associados,x=>x.toLocaleString('pt-BR')],
    ['Associados Ativos',a.ativos,x=>x.toLocaleString('pt-BR')],
    ['Novos Associados',a.novos,x=>'+'+x,'Julho/2026'],
    ['Cancelamentos',a.cancelamentos,x=>String(x),'Julho/2026'],
    ['Churn',a.churn,x=>pct(x)],

/* =========================== PERFIS E PERMISSÕES =========================== */
const MODMAP={'Dashboard':'dashboard','Fluxo de Caixa':'fluxo','DRE':'dre','Indicadores':'indicadores','Contas a Pagar':'pagar','Contas a Receber':'receber','Administração':'admin'};
function renderPermissoes(){
  let rows='';
  MODULOS_PERM.forEach(mod=>{
    rows+='<tr><td style="font-weight:600">'+mod+'</td>';
    Object.keys(PERFIS).forEach(pf=>{
      const on=PERFIS[pf].mods.includes(MODMAP[mod]);
      rows+='<td style="text-align:center"><input type="checkbox" class="perm-check" '+(on?'checked':'')+' onchange="togglePerm(\''+pf+'\',\''+mod+'\')"></td>';
    });
    rows+='</tr>';
  });
  return adminShell('Perfis e Permissões','Matriz módulo &times; perfil — alterações aplicam imediatamente',

function togglePerm(pf,mod){
  const id=MODMAP[mod], mods=PERFIS[pf].mods;

  toast('Permissão de "'+mod+'" '+(idx>=0?'removida do':'concedida ao')+' perfil '+pf);
  if(state.role===pf&&!podeVer(state.view)){ state.view='dashboard'; state.adminPage=null; }
  render();
}

  const bs=BASES[state.empresa].bancos;
  const b=i>=0?bs[i]:{banco:'',nome:'',prop:0};
  openDrawer(drawerHead(i>=0?'Editar conta bancária':'Nova conta bancária',EMPRESAS[state.empresa].curto)+'<div class="drawer-body">'+
    fld('cbBanco','Banco',b.banco)+fld('cbNome','Nome da conta',b.nome)+
    fld('cbProp','Participação no saldo (%)',Math.round(b.prop*100),'number')+
    '</div>'+crudFoot('saveBanco('+i+')'));

function saveBanco(i){
  const bs=BASES[state.empresa].bancos;
  const b={banco:$('cbBanco').value,nome:$('cbNome').value,prop:(parseFloat($('cbProp').value)||0)/100};
  if(!b.banco){ toast('Informe o banco'); return; }
  if(i>=0)bs[i]=b; else bs.push(b);
  const tot=bs.reduce((t,x)=>t+x.prop,0)||1;
  bs.forEach(x=>x.prop=x.prop/tot);
  closeDrawer(); toast('Conta salva — participações normalizadas'); render();
}

function editConta(code){
  if(code){

    openDrawer(drawerHead('Editar conta '+code,(a.t==='S'?'Sintética':'Analítica'))+'<div class="drawer-body">'+
      fld('cpNome','Nome da conta',a.n)+
      (a.t==='A'?fldSel('cpRed','Conta redutora',['Não','Sim'],a.red?'Sim':'Não'):'')+
      '</div>'+crudFoot('saveConta(\''+code+'\')'));
  } else {
    const pais=PLANO.filter(a=>a.t==='S'&&a.c!=='4'&&!a.c.startsWith('4'));
    openDrawer(drawerHead('Nova conta analítica','O código é gerado a partir da conta pai')+'<div class="drawer-body">'+
      '<div class="field"><label>Conta pai (sintética)</label><select id="cpPai">'+pais.map(a=>'<option value="'+a.c+'">'+a.c+' — '+esc(a.n)+'</option>').join('')+'</select></div>'+
      fld('cpNome','Nome da conta','')+
      '</div>'+crudFoot('saveConta(null)'));
  }
}
function saveConta(code){
  if(code){
    const a=acc(code);
    a.n=$('cpNome').value||a.n;
    const rd=$('cpRed'); if(rd)a.red=rd.value==='Sim';
  } else {
    const pai=$('cpPai').value, nome=$('cpNome').value;
    if(!nome){ toast('Informe o nome da conta'); return; }
    const irmaos=filhos(pai).map(f=>parseInt(f.c.slice(pai.length+1),10)||0);
    const seq=String((irmaos.length?Math.max(...irmaos):0)+1).padStart(2,'0');
    PLANO.push({c:pai+'.'+seq, n:nome, t:'A', pai, cls:acc(pai).cls});
  }
  closeDrawer(); toast('Plano de contas atualizado — relatórios recalculados'); render();
}

function aparLinha(t,d,key){

function applyChrome(){
